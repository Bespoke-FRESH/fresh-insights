# fresh-insights-engage — comments / subscribe / feedback API for insights.freshfoodrecs.com
# Deploy (after `npx wrangler login` or CLOUDFLARE_API_TOKEN is set):
#   npx wrangler d1 create fresh-insights-engage          # once; paste database_id below
#   npx wrangler d1 execute fresh-insights-engage --remote --file=schema.sql
#   npx wrangler secret put ADMIN_TOKEN                   # any long random string
#   npx wrangler secret put ENGINE_TOKEN                  # service token shared with the Fly engine
#   npx wrangler deploy
name = "fresh-insights-engage"
main = "src/index.js"
compatibility_date = "2026-07-01"

[[d1_databases]]
binding = "DB"
database_name = "fresh-insights-engage"
database_id = "25b8e5e5-86b9-4b6c-af16-0f2c81ecee71"

[vars]
ALLOWED_ORIGINS = "https://insights.freshfoodrecs.com,https://freshfoodrecs.com,http://localhost:8642"
# Retrieval proxy -> fresh-assistant-api. RETRIEVE_TOKEN is a secret (wrangler secret put),
# never a var. Leaving RETRIEVE_UPSTREAM unset makes /api/retrieve return 503 — the panel
# fails closed rather than erroring in the reader's face.
RETRIEVE_UPSTREAM = "https://fresh-assistant-api.fly.dev"
# The upstream has no RETRIEVE_TOKEN set, so the summary pass would 503. Off until
# RETRIEVE_TOKEN is set on both sides — /ask got its key + ASK_TOKEN pair first (A.5);
# the retrieve answer pass stays a deliberate, separate switch.
RETRIEVE_ANSWERS  = "off"
# Surface-chat proxy -> fresh-assistant-api /ask (the branded viewer's contained chat).
# ASK_TOKEN is a secret (wrangler secret put), never a var — it is the bearer the Fly
# service requires for any non-local model pass. Leaving ASK_UPSTREAM unset makes
# /api/ask return 503, so the page's chat fails closed to its built-in commands.
ASK_UPSTREAM = "https://fresh-assistant-api.fly.dev"
# Engine proxy -> fresh_diet plumber on Fly (/api/engine/*, fresh-insights#33). ENGINE_TOKEN
# is a secret (wrangler secret put), never a var — it is the service bearer the engine will
# require once it enforces the token (fresh_diet PR #76 comment). Leaving ENGINE_UPSTREAM or
# ENGINE_TOKEN unset makes /api/engine/* return 503, fail-closed like the other proxies.
# Placeholder dev value below — point this at the real Fly app before deploying.
ENGINE_UPSTREAM = "https://fresh-diet-engine.fly.dev"
# Clerk instance for verifying the caller's session JWT on /api/engine/*. These are the
# published dev-instance JWKS/issuer values (fresh_app ruling D-2026-09-11-6), not secrets —
# a JWKS endpoint is public by design. Point at a different instance only if fresh_app's own
# Clerk instance changes.
CLERK_ISSUER    = "https://crisp-scorpion-5272.clerk.accounts.dev"
CLERK_JWKS_URL  = "https://crisp-scorpion-5272.clerk.accounts.dev/.well-known/jwks.json"

# Surfaces the deployed version id + timestamp on every response (X-Worker-Version /
# X-Worker-Deployed). Requires no deploy-time plumbing: Cloudflare populates it.
[version_metadata]
binding = "CF_VERSION_METADATA"
