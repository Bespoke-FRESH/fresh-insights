<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 668" width="1150" height="668" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif"><rect width="1150" height="668" fill="#fffdf8"/><text x="44" y="62" font-size="34" font-weight="700" fill="#1a3a2a">Compression of morbidity, and what happened instead</text><text x="44" y="98" font-size="17" fill="#6b7b6b">Life extends left to right. The dark segment is the part spent unwell.</text><text x="44" y="138" font-size="17" font-weight="700" fill="#1a3a2a">Baseline</text><rect x="44" y="150" width="430" height="64" rx="4" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="474" y="150" width="200" height="64" rx="4" fill="#9aaa9a"/><text x="58" y="189" font-size="15" fill="#6b7b6b">healthy</text><text x="488" y="189" font-size="15" fill="#fffdf8">morbidity</text><text x="692" y="189" font-size="15" fill="#9aaa9a">A life, and the unwell part of it.</text><text x="44" y="250" font-size="17" font-weight="700" fill="#1a3a2a">Compression &#8212; what is being sold</text><rect x="44" y="262" width="540" height="64" rx="4" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="584" y="262" width="160" height="64" rx="4" fill="#2a5a3a"/><text x="58" y="301" font-size="15" fill="#6b7b6b">healthy</text><text x="598" y="301" font-size="15" fill="#fffdf8">morbidity</text><text x="762" y="301" font-size="15" fill="#9aaa9a">Longer life, shorter sick span.</text><text x="44" y="362" font-size="17" font-weight="700" fill="#1a3a2a">What was observed</text><rect x="44" y="374" width="556" height="64" rx="4" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="600" y="374" width="254" height="64" rx="4" fill="#b4532f"/><text x="58" y="413" font-size="15" fill="#6b7b6b">healthy</text><text x="614" y="413" font-size="15" fill="#fffdf8">morbidity</text><text x="872" y="413" font-size="15" fill="#9aaa9a">Not shorter. Possibly longer.</text><rect x="44" y="494" width="1062" height="78" rx="6" fill="#fffdf8" stroke="#b4532f" stroke-width="1.6" stroke-dasharray="7 5"/><text x="70" y="527" font-size="19" font-weight="700" fill="#b4532f">Lifespan is not a validated stand-in for healthspan.</text><text x="70" y="555" font-size="16" fill="#6b7b6b">It is only what can be counted, and the assumption was not tested until now.</text><line x1="44" y1="604" x2="1106" y2="604" stroke="#eee8df" stroke-width="1"/><text x="44" y="628" font-size="15" fill="#6b7b6b">Schematic of the concept and the reported direction of effect in mice.</text><text x="44" y="652" font-size="15" fill="#9aaa9a">insights.freshfoodrecs.com &#183; schematic &#183; August 2026</text></svg>