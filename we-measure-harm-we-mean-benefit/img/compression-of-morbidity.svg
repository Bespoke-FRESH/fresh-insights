<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 570" width="1150" height="570" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif"><rect width="1150" height="570" fill="#fffdf8"/><text x="56" y="60" font-size="33.0" font-weight="700" fill="#1a3a2a">Compression of morbidity, and what happened instead</text><text x="44" y="98" font-size="17" fill="#6b7b6b">Life extends left to right. The dark segment is the part spent unwell.</text><text x="44" y="165" font-size="17.0" font-weight="700" fill="#1a3a2a">Baseline</text><rect x="44" y="175" width="430" height="66" rx="4" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="474" y="175" width="200" height="66" rx="4" fill="#9aaa9a"/><text x="60" y="213" font-size="15.5" fill="#6b7b6b">healthy</text><text x="490" y="213" font-size="15.5" fill="#fffdf8">morbidity</text><text x="694" y="213" font-size="15.5" fill="#9aaa9a">A life, and the unwell part of it.</text><text x="44" y="277" font-size="17.0" font-weight="700" fill="#1a3a2a">Compression &#8212; what the field is selling</text><rect x="44" y="287" width="540" height="66" rx="4" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="584" y="287" width="160" height="66" rx="4" fill="#2a5a3a"/><text x="60" y="325" font-size="15.5" fill="#6b7b6b">healthy</text><text x="600" y="325" font-size="15.5" fill="#fffdf8">morbidity</text><text x="764" y="325" font-size="15.5" fill="#9aaa9a">Longer life, shorter sick span.</text><text x="44" y="389" font-size="17.0" font-weight="700" fill="#1a3a2a">What was actually observed</text><rect x="44" y="399" width="556" height="66" rx="4" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="600" y="399" width="254" height="66" rx="4" fill="#b4532f"/><text x="60" y="437" font-size="15.5" fill="#6b7b6b">healthy</text><text x="616" y="437" font-size="15.5" fill="#fffdf8">morbidity</text><text x="874" y="437" font-size="15.5" fill="#9aaa9a">Not shorter. Possibly longer.</text><rect x="44" y="527" width="1062" height="86" rx="6" fill="#fffdf8" stroke="#b4532f" stroke-width="1.6" stroke-dasharray="7 5"/><text x="70" y="561" font-size="20.0" font-weight="700" fill="#b4532f">The surrogate and the target moved in opposite directions.</text><text x="70" y="591" font-size="16.0" fill="#6b7b6b">Anyone optimising lifespan would think they were winning. This is what a surrogate failing looks like while it is still being used.</text><line x1="44" y1="508" x2="1106" y2="508" stroke="#eee8df" stroke-width="1"/><text x="44" y="530" font-size="15" fill="#6b7b6b">Schematic of the concept and the reported direction of effect, from life-extending interventions in mice. Segment lengths are illustrative.</text><text x="44" y="552" font-size="15" fill="#9aaa9a">insights.freshfoodrecs.com &#183; schematic &#183; August 2026</text></svg>