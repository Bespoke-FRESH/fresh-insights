<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 662" width="1150" height="662" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif"><rect width="1150" height="662" fill="#fffdf8"/><text x="44" y="62" font-size="34" font-weight="700" fill="#1a3a2a">Why one side scaled and the other didn&#8217;t</text><text x="44" y="98" font-size="17" fill="#6b7b6b">The same asymmetry as the diagnosis codes, one layer up in the apparatus.</text><rect x="44" y="150" width="520" height="356" rx="8" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="44" y="150" width="520" height="7" rx="3" fill="#2a5a3a"/><text x="72" y="196" font-size="22" font-weight="700" fill="#1a3a2a">Harm surveillance</text><text x="72" y="222" font-size="15" font-weight="700" letter-spacing="1.4" fill="#2a5a3a">GENERAL</text><text x="72" y="250" font-size="15" fill="#9aaa9a">FDA Sentinel &#183; WHO VigiBase &#183; Yellow Card</text><text x="72" y="292" font-size="19" font-weight="700" fill="#1a3a2a">&#8220;Did something go wrong?&#8221;</text><text x="72" y="320" font-size="16" fill="#6b7b6b">One question, asked of anything.</text><text x="72" y="360" font-size="15" font-weight="700" letter-spacing="1.3" fill="#9aaa9a">NEEDS FIRST</text><circle cx="78" cy="385" r="3.5" fill="#2a5a3a"/><text x="94" y="390" font-size="16" fill="#1a3a2a">any product</text><circle cx="78" cy="415" r="3.5" fill="#2a5a3a"/><text x="94" y="420" font-size="16" fill="#1a3a2a">any person</text><circle cx="78" cy="445" r="3.5" fill="#2a5a3a"/><text x="94" y="450" font-size="16" fill="#1a3a2a">no prior agreement needed</text><text x="72" y="488" font-size="16" font-style="italic" fill="#6b7b6b">Scales to what nobody anticipated.</text><rect x="586" y="150" width="520" height="356" rx="8" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="586" y="150" width="520" height="7" rx="3" fill="#c9a227"/><text x="614" y="196" font-size="22" font-weight="700" fill="#1a3a2a">Benefit surveillance</text><text x="614" y="222" font-size="15" font-weight="700" letter-spacing="1.4" fill="#c9a227">ENUMERATED</text><text x="614" y="250" font-size="15" fill="#9aaa9a">National PROMs &#183; HEDIS &#183; ICHOM</text><text x="614" y="292" font-size="19" font-weight="700" fill="#1a3a2a">&#8220;Did this specific thing improve?&#8221;</text><text x="614" y="320" font-size="16" fill="#6b7b6b">One agreed outcome, per named condition.</text><text x="614" y="360" font-size="15" font-weight="700" letter-spacing="1.3" fill="#9aaa9a">NEEDS FIRST</text><circle cx="620" cy="385" r="3.5" fill="#c9a227"/><text x="636" y="390" font-size="16" fill="#1a3a2a">a named procedure</text><circle cx="620" cy="415" r="3.5" fill="#c9a227"/><text x="636" y="420" font-size="16" fill="#1a3a2a">a defined population</text><circle cx="620" cy="445" r="3.5" fill="#c9a227"/><text x="636" y="450" font-size="16" fill="#1a3a2a">an agreed definition of better</text><text x="614" y="488" font-size="16" font-style="italic" fill="#6b7b6b">Built one condition at a time.</text><text x="44" y="550" font-size="19" font-weight="700" fill="#1a3a2a">Harm is legible without anyone having agreed what good looks like.</text><line x1="44" y1="598" x2="1106" y2="598" stroke="#eee8df" stroke-width="1"/><text x="44" y="622" font-size="15" fill="#6b7b6b">Schematic. The systems named are real and cited; nothing here is a count.</text><text x="44" y="646" font-size="15" fill="#9aaa9a">insights.freshfoodrecs.com &#183; schematic &#183; August 2026</text></svg>