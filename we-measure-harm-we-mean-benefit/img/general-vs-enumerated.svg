<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 588" width="1150" height="588" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif"><rect width="1150" height="588" fill="#fffdf8"/><text x="56" y="60" font-size="33.0" font-weight="700" fill="#1a3a2a">Why one side scaled and the other didn&#8217;t</text><text x="44" y="98" font-size="17" fill="#6b7b6b">The same asymmetry as the diagnosis codes, one layer up in the apparatus.</text><rect x="44" y="150" width="510" height="380" rx="8" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="44" y="150" width="510" height="7" rx="3" fill="#2a5a3a"/><text x="74" y="196" font-size="23.0" font-weight="700" fill="#1a3a2a">Harm surveillance</text><text x="74" y="224" font-size="15.0" font-weight="700" letter-spacing="1.4" fill="#2a5a3a">GENERAL</text><text x="74" y="256" font-size="15.0" fill="#9aaa9a">FDA Sentinel &#183; WHO VigiBase &#183; MHRA Yellow Card</text><text x="74" y="300" font-size="19.0" font-weight="700" fill="#1a3a2a">&#8220;Did something go wrong?&#8221;</text><text x="74" y="328" font-size="15.5" fill="#6b7b6b">One question, asked of anything.</text><text x="74" y="372" font-size="15.0" font-weight="700" letter-spacing="1.3" fill="#9aaa9a">NEEDS FIRST</text><circle cx="80" cy="395" r="3.5" fill="#2a5a3a"/><text x="96" y="400" font-size="16.0" fill="#1a3a2a">any product</text><circle cx="80" cy="425" r="3.5" fill="#2a5a3a"/><text x="96" y="430" font-size="16.0" fill="#1a3a2a">any person</text><circle cx="80" cy="455" r="3.5" fill="#2a5a3a"/><text x="96" y="460" font-size="16.0" fill="#1a3a2a">no prior agreement needed</text><text x="74" y="508" font-size="15.5" font-style="italic" fill="#6b7b6b">Scales to things nobody anticipated.</text><rect x="596" y="150" width="510" height="380" rx="8" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="596" y="150" width="510" height="7" rx="3" fill="#c9a227"/><text x="626" y="196" font-size="23.0" font-weight="700" fill="#1a3a2a">Benefit surveillance</text><text x="626" y="224" font-size="15.0" font-weight="700" letter-spacing="1.4" fill="#c9a227">ENUMERATED</text><text x="626" y="256" font-size="15.0" fill="#9aaa9a">National PROMs &#183; HEDIS &#183; ICHOM</text><text x="626" y="300" font-size="19.0" font-weight="700" fill="#1a3a2a">&#8220;Did this specific thing improve?&#8221;</text><text x="626" y="328" font-size="15.5" fill="#6b7b6b">One agreed outcome, per named condition.</text><text x="626" y="372" font-size="15.0" font-weight="700" letter-spacing="1.3" fill="#9aaa9a">NEEDS FIRST</text><circle cx="632" cy="395" r="3.5" fill="#c9a227"/><text x="648" y="400" font-size="16.0" fill="#1a3a2a">a named procedure</text><circle cx="632" cy="425" r="3.5" fill="#c9a227"/><text x="648" y="430" font-size="16.0" fill="#1a3a2a">a defined population</text><circle cx="632" cy="455" r="3.5" fill="#c9a227"/><text x="648" y="460" font-size="16.0" fill="#1a3a2a">someone already agreed what better means</text><text x="626" y="508" font-size="15.5" font-style="italic" fill="#6b7b6b">Has to be built one condition at a time.</text><text x="44" y="576" font-size="19.0" font-weight="700" fill="#1a3a2a">Harm is legible without anyone having agreed what good looks like. Benefit is not.</text><line x1="44" y1="526" x2="1106" y2="526" stroke="#eee8df" stroke-width="1"/><text x="44" y="548" font-size="15" fill="#6b7b6b">Schematic. Systems named are real and cited in the essay; nothing here is a count or a comparison of size.</text><text x="44" y="570" font-size="15" fill="#9aaa9a">insights.freshfoodrecs.com &#183; schematic &#183; August 2026</text></svg>