<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 636" width="1150" height="636" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif"><rect width="1150" height="636" fill="#fffdf8"/><text x="44" y="62" font-size="34" font-weight="700" fill="#1a3a2a">When benefit need not be proven, the brand is the product</text><text x="44" y="98" font-size="17" fill="#6b7b6b">US dietary supplement products, before and after the 1994 framework.</text><text x="44" y="138" font-size="17" font-weight="700" fill="#1a3a2a">1994 &#183; DSHEA passes</text><rect x="44" y="150" width="34.4" height="48" rx="4" fill="#9aaa9a"/><text x="94.4" y="181" font-size="16" fill="#6b7b6b">about 4,000 products</text><text x="44" y="266" font-size="17" font-weight="700" fill="#1a3a2a">Today</text><rect x="44" y="278" width="860.0" height="48" rx="4" fill="#2a5a3a"/><text x="60" y="309" font-size="16" fill="#fffdf8">FDA estimates more than 100,000</text><text x="44" y="418" font-size="21" font-weight="700" fill="#1a3a2a">Twenty-five times the products, under a rule that never required proof.</text><text x="44" y="452" font-size="16" fill="#6b7b6b">A hundred thousand products still have to be told apart, and evidence cannot do the sorting.</text><rect x="44" y="478" width="1062" height="62" rx="6" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="44" y="478" width="6" height="62" rx="3" fill="#c9a227"/><text x="70" y="516" font-size="19" font-weight="700" fill="#1a3a2a">What is left to compete on is brand.</text><line x1="44" y1="572" x2="1106" y2="572" stroke="#eee8df" stroke-width="1"/><text x="44" y="596" font-size="15" fill="#6b7b6b">Both figures are real and cited. Bar length encodes count; no area scaling.</text><text x="44" y="620" font-size="15" fill="#9aaa9a">insights.freshfoodrecs.com &#183; 1994 baseline and current FDA estimate &#183; August 2026</text></svg>