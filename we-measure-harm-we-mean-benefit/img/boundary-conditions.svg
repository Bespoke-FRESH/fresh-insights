<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1226" width="1150" height="1226" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif"><rect width="1150" height="1226" fill="#fffdf8"/><text x="44" y="62" font-size="34" font-weight="700" fill="#1a3a2a">It takes all three, or nothing can tell you to stop</text><text x="44" y="98" font-size="17" fill="#6b7b6b">Seven cases from the essay, and what fills each condition.</text><text x="304" y="146" font-size="15" font-weight="700" letter-spacing="1.3" fill="#b4532f">ALL THREE, OF THE SAME PERSON, TREATMENT AND OUTCOME</text><path d="M304 166 L304 156 L918 156 L918 166" fill="none" stroke="#b4532f" stroke-width="1.4"/><text x="44" y="190" font-size="16" font-weight="700" fill="#1a3a2a">The case</text><text x="44" y="212" font-size="15" fill="#9aaa9a">person, treatment, outcome</text><text x="304" y="190" font-size="16" font-weight="700" fill="#1a3a2a">A diagnosis</text><text x="304" y="212" font-size="15" font-weight="400" fill="#9aaa9a">someone crossed a named</text><text x="304" y="231" font-size="15" font-weight="400" fill="#9aaa9a">threshold</text><text x="516" y="190" font-size="16" font-weight="700" fill="#1a3a2a">A dominant causal</text><text x="516" y="211" font-size="16" font-weight="700" fill="#1a3a2a">pathway</text><text x="516" y="233" font-size="15" font-weight="400" fill="#9aaa9a">moving it moves the</text><text x="516" y="252" font-size="15" font-weight="400" fill="#9aaa9a">outcome</text><text x="728" y="190" font-size="16" font-weight="700" fill="#1a3a2a">A validated surrogate</text><text x="728" y="212" font-size="15" font-weight="400" fill="#9aaa9a">prior trials showed the</text><text x="728" y="231" font-size="15" font-weight="400" fill="#9aaa9a">marker carries through</text><text x="936" y="190" font-size="16" font-weight="700" fill="#1a3a2a">Can anything say</text><text x="936" y="211" font-size="16" font-weight="700" fill="#1a3a2a">stop?</text><line x1="44" y1="268" x2="1106" y2="268" stroke="#eee8df" stroke-width="1"/><rect x="44" y="282" width="4" height="105" rx="2" fill="#2a5a3a"/><text x="60" y="306" font-size="18" font-weight="700" fill="#1a3a2a">Contrave</text><text x="60" y="326" font-size="15" font-weight="400" fill="#6b7b6b">for weight loss, in obesity</text><rect x="304" y="282" width="190" height="105" rx="5" fill="#f5f2ed"/><polyline points="317,304 321.6,309 329,298" fill="none" stroke="#2a5a3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="317" y="324" font-size="15" font-weight="400" fill="#1a3a2a">Obesity, at a defined</text><text x="317" y="343" font-size="15" font-weight="400" fill="#1a3a2a">BMI threshold</text><rect x="516" y="282" width="190" height="105" rx="5" fill="#f5f2ed"/><polyline points="529,304 533.6,309 541,298" fill="none" stroke="#2a5a3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="529" y="324" font-size="15" font-weight="400" fill="#1a3a2a">The drug acts through</text><text x="529" y="343" font-size="15" font-weight="400" fill="#1a3a2a">body weight</text><rect x="728" y="282" width="190" height="105" rx="5" fill="#f5f2ed"/><polyline points="741,304 745.6,309 753,298" fill="none" stroke="#2a5a3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="741" y="324" font-size="15" font-weight="400" fill="#1a3a2a">5% of baseline weight</text><text x="741" y="343" font-size="15" font-weight="400" fill="#1a3a2a">by week 12</text><text x="936" y="304" font-size="16" font-weight="700" fill="#2a5a3a" letter-spacing="0.6">YES</text><text x="936" y="324" font-size="15" font-weight="400" fill="#6b7b6b">Discontinue at week</text><text x="936" y="343" font-size="15" font-weight="400" fill="#6b7b6b">12. It is on the</text><text x="936" y="362" font-size="15" font-weight="400" fill="#6b7b6b">label.</text><text x="505.0" y="309" font-size="17" font-weight="700" fill="#b4532f" text-anchor="middle" opacity="0.75">+</text><text x="717.0" y="309" font-size="17" font-weight="700" fill="#b4532f" text-anchor="middle" opacity="0.75">+</text><rect x="44" y="393" width="4" height="105" rx="2" fill="#2a5a3a"/><text x="60" y="417" font-size="18" font-weight="700" fill="#1a3a2a">Treat-to-target</text><text x="60" y="437" font-size="15" font-weight="400" fill="#6b7b6b">for disease control, in</text><text x="60" y="456" font-size="15" font-weight="400" fill="#6b7b6b">rheumatoid arthritis</text><rect x="304" y="393" width="190" height="105" rx="5" fill="#f5f2ed"/><polyline points="317,415 321.6,420 329,409" fill="none" stroke="#2a5a3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="317" y="435" font-size="15" font-weight="400" fill="#1a3a2a">Rheumatoid arthritis,</text><text x="317" y="454" font-size="15" font-weight="400" fill="#1a3a2a">classified</text><rect x="516" y="393" width="190" height="105" rx="5" fill="#f5f2ed"/><polyline points="529,415 533.6,420 541,409" fill="none" stroke="#2a5a3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="529" y="435" font-size="15" font-weight="400" fill="#1a3a2a">Joint inflammation</text><text x="529" y="454" font-size="15" font-weight="400" fill="#1a3a2a">drives the damage</text><rect x="728" y="393" width="190" height="105" rx="5" fill="#f5f2ed"/><polyline points="741,415 745.6,420 753,409" fill="none" stroke="#2a5a3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="741" y="435" font-size="15" font-weight="400" fill="#1a3a2a">A disease activity</text><text x="741" y="454" font-size="15" font-weight="400" fill="#1a3a2a">score</text><text x="936" y="415" font-size="16" font-weight="700" fill="#2a5a3a" letter-spacing="0.6">YES</text><text x="936" y="435" font-size="15" font-weight="400" fill="#6b7b6b">A target, a review</text><text x="936" y="454" font-size="15" font-weight="400" fill="#6b7b6b">date, an escalation</text><text x="936" y="473" font-size="15" font-weight="400" fill="#6b7b6b">rule.</text><text x="505.0" y="420" font-size="17" font-weight="700" fill="#b4532f" text-anchor="middle" opacity="0.75">+</text><text x="717.0" y="420" font-size="17" font-weight="700" fill="#b4532f" text-anchor="middle" opacity="0.75">+</text><rect x="44" y="504" width="4" height="105" rx="2" fill="#2a5a3a"/><text x="60" y="528" font-size="18" font-weight="700" fill="#1a3a2a">RECIST</text><text x="60" y="548" font-size="15" font-weight="400" fill="#6b7b6b">for tumour response, in a</text><text x="60" y="567" font-size="15" font-weight="400" fill="#6b7b6b">solid tumour</text><rect x="304" y="504" width="190" height="105" rx="5" fill="#f5f2ed"/><polyline points="317,526 321.6,531 329,520" fill="none" stroke="#2a5a3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="317" y="546" font-size="15" font-weight="400" fill="#1a3a2a">A staged solid tumour</text><rect x="516" y="504" width="190" height="105" rx="5" fill="#f5f2ed"/><polyline points="529,526 533.6,531 541,520" fill="none" stroke="#2a5a3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="529" y="546" font-size="15" font-weight="400" fill="#1a3a2a">Tumour burden drives</text><text x="529" y="565" font-size="15" font-weight="400" fill="#1a3a2a">the outcome</text><rect x="728" y="504" width="190" height="105" rx="5" fill="#f5f2ed"/><polyline points="741,526 745.6,531 753,520" fill="none" stroke="#2a5a3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="741" y="546" font-size="15" font-weight="400" fill="#1a3a2a">Tumour measurement</text><text x="936" y="526" font-size="16" font-weight="700" fill="#2a5a3a" letter-spacing="0.6">YES</text><text x="936" y="546" font-size="15" font-weight="400" fill="#6b7b6b">Progressive disease,</text><text x="936" y="565" font-size="15" font-weight="400" fill="#6b7b6b">defined before you</text><text x="936" y="584" font-size="15" font-weight="400" fill="#6b7b6b">start.</text><text x="505.0" y="531" font-size="17" font-weight="700" fill="#b4532f" text-anchor="middle" opacity="0.75">+</text><text x="717.0" y="531" font-size="17" font-weight="700" fill="#b4532f" text-anchor="middle" opacity="0.75">+</text><rect x="44" y="615" width="4" height="105" rx="2" fill="#2a5a3a"/><text x="60" y="639" font-size="18" font-weight="700" fill="#1a3a2a">Time-limited trial</text><text x="60" y="659" font-size="15" font-weight="400" fill="#6b7b6b">for organ support, in critical</text><text x="60" y="678" font-size="15" font-weight="400" fill="#6b7b6b">illness</text><rect x="304" y="615" width="190" height="105" rx="5" fill="#f5f2ed"/><polyline points="317,637 321.6,642 329,631" fill="none" stroke="#2a5a3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="317" y="657" font-size="15" font-weight="400" fill="#1a3a2a">Critical illness, in</text><text x="317" y="676" font-size="15" font-weight="400" fill="#1a3a2a">front of you</text><rect x="516" y="615" width="190" height="105" rx="5" fill="#f5f2ed"/><polyline points="529,637 533.6,642 541,631" fill="none" stroke="#2a5a3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="529" y="657" font-size="15" font-weight="400" fill="#1a3a2a">Organ failure drives</text><text x="529" y="676" font-size="15" font-weight="400" fill="#1a3a2a">the outcome</text><rect x="728" y="615" width="190" height="105" rx="5" fill="#f5f2ed"/><polyline points="741,637 745.6,642 753,631" fill="none" stroke="#2a5a3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="741" y="657" font-size="15" font-weight="400" fill="#1a3a2a">The trajectory of</text><text x="741" y="676" font-size="15" font-weight="400" fill="#1a3a2a">organ failure</text><text x="936" y="637" font-size="16" font-weight="700" fill="#2a5a3a" letter-spacing="0.6">YES</text><text x="936" y="657" font-size="15" font-weight="400" fill="#6b7b6b">A reassessment date,</text><text x="936" y="676" font-size="15" font-weight="400" fill="#6b7b6b">agreed with the</text><text x="936" y="695" font-size="15" font-weight="400" fill="#6b7b6b">family.</text><text x="505.0" y="642" font-size="17" font-weight="700" fill="#b4532f" text-anchor="middle" opacity="0.75">+</text><text x="717.0" y="642" font-size="17" font-weight="700" fill="#b4532f" text-anchor="middle" opacity="0.75">+</text><rect x="44" y="726" width="4" height="105" rx="2" fill="#b4532f"/><text x="60" y="750" font-size="18" font-weight="700" fill="#1a3a2a">Berberine</text><text x="60" y="770" font-size="15" font-weight="400" fill="#6b7b6b">for weight loss, sold as</text><text x="60" y="789" font-size="15" font-weight="400" fill="#6b7b6b">&#8220;nature&#8217;s Ozempic&#8221;</text><rect x="304" y="726" width="190" height="105" rx="5" fill="#fffdf8" stroke="#b4532f" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.85"/><line x1="317" y1="743" x2="329" y2="743" stroke="#b4532f" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/><text x="317" y="768" font-size="15" font-weight="400" fill="#6b7b6b">None required to buy</text><text x="317" y="787" font-size="15" font-weight="400" fill="#6b7b6b">it</text><rect x="516" y="726" width="190" height="105" rx="5" fill="#fffdf8" stroke="#b4532f" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.85"/><line x1="529" y1="743" x2="541" y2="743" stroke="#b4532f" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/><text x="529" y="768" font-size="15" font-weight="400" fill="#6b7b6b">No pathway anyone had</text><text x="529" y="787" font-size="15" font-weight="400" fill="#6b7b6b">to establish</text><rect x="728" y="726" width="190" height="105" rx="5" fill="#fffdf8" stroke="#b4532f" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.85"/><line x1="741" y1="743" x2="753" y2="743" stroke="#b4532f" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/><text x="741" y="768" font-size="15" font-weight="400" fill="#6b7b6b">Nothing to fail</text><text x="741" y="787" font-size="15" font-weight="400" fill="#6b7b6b">against</text><text x="936" y="748" font-size="16" font-weight="700" fill="#b4532f" letter-spacing="0.6">NO</text><text x="936" y="768" font-size="15" font-weight="400" fill="#6b7b6b">No rule, and nothing</text><text x="936" y="787" font-size="15" font-weight="400" fill="#6b7b6b">that would produce</text><text x="936" y="806" font-size="15" font-weight="400" fill="#6b7b6b">one.</text><text x="505.0" y="753" font-size="17" font-weight="700" fill="#b4532f" text-anchor="middle" opacity="0.75">+</text><text x="717.0" y="753" font-size="17" font-weight="700" fill="#b4532f" text-anchor="middle" opacity="0.75">+</text><rect x="44" y="837" width="4" height="105" rx="2" fill="#b4532f"/><text x="60" y="861" font-size="18" font-weight="700" fill="#1a3a2a">A life-extending diet</text><text x="60" y="881" font-size="15" font-weight="400" fill="#6b7b6b">for healthspan, in the</text><text x="60" y="900" font-size="15" font-weight="400" fill="#6b7b6b">longevity field</text><rect x="304" y="837" width="190" height="105" rx="5" fill="#fffdf8" stroke="#b4532f" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.85"/><line x1="317" y1="854" x2="329" y2="854" stroke="#b4532f" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/><text x="317" y="879" font-size="15" font-weight="400" fill="#6b7b6b">Aging is not a</text><text x="317" y="898" font-size="15" font-weight="400" fill="#6b7b6b">diagnosis</text><rect x="516" y="837" width="190" height="105" rx="5" fill="#fffdf8" stroke="#b4532f" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.85"/><line x1="529" y1="854" x2="541" y2="854" stroke="#b4532f" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/><text x="529" y="879" font-size="15" font-weight="400" fill="#6b7b6b">Diffuse by</text><text x="529" y="898" font-size="15" font-weight="400" fill="#6b7b6b">construction</text><rect x="728" y="837" width="190" height="105" rx="5" fill="#fffdf8" stroke="#b4532f" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.85"/><line x1="741" y1="854" x2="753" y2="854" stroke="#b4532f" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/><text x="741" y="879" font-size="15" font-weight="400" fill="#6b7b6b">Lifespan was never</text><text x="741" y="898" font-size="15" font-weight="400" fill="#6b7b6b">qualified for</text><text x="741" y="917" font-size="15" font-weight="400" fill="#6b7b6b">healthspan</text><text x="936" y="859" font-size="16" font-weight="700" fill="#b4532f" letter-spacing="0.6">NO</text><text x="936" y="879" font-size="15" font-weight="400" fill="#6b7b6b">Longer life, and the</text><text x="936" y="898" font-size="15" font-weight="400" fill="#6b7b6b">sick span did not</text><text x="936" y="917" font-size="15" font-weight="400" fill="#6b7b6b">shorten.</text><text x="505.0" y="864" font-size="17" font-weight="700" fill="#b4532f" text-anchor="middle" opacity="0.75">+</text><text x="717.0" y="864" font-size="17" font-weight="700" fill="#b4532f" text-anchor="middle" opacity="0.75">+</text><rect x="44" y="948" width="4" height="86" rx="2" fill="#b4532f"/><text x="60" y="972" font-size="18" font-weight="700" fill="#1a3a2a">You, most of the time</text><text x="60" y="992" font-size="15" font-weight="400" fill="#6b7b6b">for energy, sleep, aging well</text><rect x="304" y="948" width="190" height="86" rx="5" fill="#fffdf8" stroke="#b4532f" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.85"/><line x1="317" y1="965" x2="329" y2="965" stroke="#b4532f" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/><text x="317" y="990" font-size="15" font-weight="400" fill="#6b7b6b">Below the diagnostic</text><text x="317" y="1009" font-size="15" font-weight="400" fill="#6b7b6b">threshold</text><rect x="516" y="948" width="190" height="86" rx="5" fill="#fffdf8" stroke="#b4532f" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.85"/><line x1="529" y1="965" x2="541" y2="965" stroke="#b4532f" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/><text x="529" y="990" font-size="15" font-weight="400" fill="#6b7b6b">No single pathway to</text><text x="529" y="1009" font-size="15" font-weight="400" fill="#6b7b6b">move</text><rect x="728" y="948" width="190" height="86" rx="5" fill="#fffdf8" stroke="#b4532f" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.85"/><line x1="741" y1="965" x2="753" y2="965" stroke="#b4532f" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/><text x="741" y="990" font-size="15" font-weight="400" fill="#6b7b6b">No biomarker was ever</text><text x="741" y="1009" font-size="15" font-weight="400" fill="#6b7b6b">qualified</text><text x="936" y="970" font-size="16" font-weight="700" fill="#b4532f" letter-spacing="0.6">NO</text><text x="936" y="990" font-size="15" font-weight="400" fill="#6b7b6b">So the default is that</text><text x="936" y="1009" font-size="15" font-weight="400" fill="#6b7b6b">you continue.</text><text x="505.0" y="975" font-size="17" font-weight="700" fill="#b4532f" text-anchor="middle" opacity="0.75">+</text><text x="717.0" y="975" font-size="17" font-weight="700" fill="#b4532f" text-anchor="middle" opacity="0.75">+</text><line x1="916" y1="268" x2="916" y2="1034" stroke="#eee8df" stroke-width="1"/><rect x="44" y="1052" width="1062" height="78" rx="6" fill="#fffdf8" stroke="#b4532f" stroke-width="1.6" stroke-dasharray="7 5"/><text x="70" y="1085" font-size="19" font-weight="700" fill="#b4532f">One blank cell is enough. There is no partial credit in this table.</text><text x="70" y="1113" font-size="16" fill="#6b7b6b">Most people, most of the time, are reading the bottom three rows.</text><line x1="44" y1="1162" x2="1106" y2="1162" stroke="#eee8df" stroke-width="1"/><text x="44" y="1186" font-size="15" fill="#6b7b6b">Schematic. Every case named is real and cited in the essay. Nothing here encodes a quantity.</text><text x="44" y="1210" font-size="15" fill="#9aaa9a">insights.freshfoodrecs.com &#183; schematic &#183; August 2026</text></svg>