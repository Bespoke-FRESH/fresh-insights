<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 782" width="1150" height="782" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif"><rect width="1150" height="782" fill="#fffdf8"/><text x="44" y="62" font-size="34" font-weight="700" fill="#1a3a2a">Three conditions, and almost nobody clears them</text><text x="44" y="98" font-size="17" fill="#6b7b6b">What has to be true before a stopping rule can exist at all.</text><rect x="44" y="150" width="690" height="122" rx="6" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="44" y="150" width="6" height="122" rx="3" fill="#2a5a3a"/><text x="70" y="190" font-size="21" font-weight="700" fill="#1a3a2a">A diagnosis</text><text x="70" y="222" font-size="16" fill="#6b7b6b">Someone has already crossed a threshold and been named.</text><text x="70" y="250" font-size="15" fill="#b4532f">Excludes everyone below it &#8212; the whole positive-health gradient.</text><line x1="750" y1="211.0" x2="790" y2="211.0" stroke="#b4532f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="802" y="217.0" font-size="15" fill="#9aaa9a">shed here</text><rect x="44" y="298" width="598" height="122" rx="6" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="44" y="298" width="6" height="122" rx="3" fill="#2a5a3a"/><text x="70" y="338" font-size="21" font-weight="700" fill="#1a3a2a">A dominant causal pathway</text><text x="70" y="370" font-size="16" fill="#6b7b6b">The mechanism is single and agreed, so moving it means something.</text><text x="70" y="398" font-size="15" fill="#b4532f">Excludes anything diffuse or contested.</text><line x1="658" y1="359.0" x2="698" y2="359.0" stroke="#b4532f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="710" y="365.0" font-size="15" fill="#9aaa9a">shed here</text><rect x="44" y="446" width="506" height="122" rx="6" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="44" y="446" width="6" height="122" rx="3" fill="#2a5a3a"/><text x="70" y="486" font-size="21" font-weight="700" fill="#1a3a2a">A validated surrogate</text><text x="70" y="518" font-size="16" fill="#6b7b6b">Somebody established that moving the measure moves the outcome.</text><text x="70" y="546" font-size="15" fill="#b4532f">Excludes anything nobody qualified, and that queue is closed.</text><line x1="566" y1="507.0" x2="606" y2="507.0" stroke="#b4532f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="618" y="513.0" font-size="15" fill="#9aaa9a">shed here</text><rect x="44" y="608" width="1062" height="78" rx="6" fill="#fffdf8" stroke="#b4532f" stroke-width="1.6" stroke-dasharray="7 5"/><text x="70" y="641" font-size="19" font-weight="700" fill="#b4532f">Clear all three and medicine can tell you to stop.</text><text x="70" y="669" font-size="16" fill="#6b7b6b">Miss any one and nothing in the apparatus can.</text><line x1="44" y1="718" x2="1106" y2="718" stroke="#eee8df" stroke-width="1"/><text x="44" y="742" font-size="15" fill="#6b7b6b">Schematic of the argument, not data. Band widths are illustrative.</text><text x="44" y="766" font-size="15" fill="#9aaa9a">insights.freshfoodrecs.com &#183; schematic &#183; August 2026</text></svg>