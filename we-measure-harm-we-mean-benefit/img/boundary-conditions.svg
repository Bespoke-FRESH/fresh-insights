<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 662" width="1150" height="662" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif"><rect width="1150" height="662" fill="#fffdf8"/><text x="56" y="60" font-size="33.0" font-weight="700" fill="#1a3a2a">Three conditions, and almost nobody clears them</text><text x="44" y="98" font-size="17" fill="#6b7b6b">What has to be true before a stopping rule can exist at all. Each condition takes territory away from the one above it.</text><rect x="44" y="150" width="690" height="122" rx="6" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="44" y="150" width="6" height="122" rx="3" fill="#2a5a3a"/><text x="70" y="188" font-size="21.0" font-weight="700" fill="#1a3a2a">A diagnosis</text><text x="70" y="218" font-size="15.5" fill="#6b7b6b">Someone has already crossed a threshold and been named.</text><text x="70" y="246" font-size="15.0" fill="#b4532f">Excludes everyone below it — the whole positive-health gradient.</text><line x1="748" y1="211.0" x2="792" y2="211.0" stroke="#b4532f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="802" y="217.0" font-size="15.0" fill="#9aaa9a">shed here</text><rect x="44" y="302" width="598" height="122" rx="6" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="44" y="302" width="6" height="122" rx="3" fill="#2a5a3a"/><text x="70" y="340" font-size="21.0" font-weight="700" fill="#1a3a2a">A dominant causal pathway</text><text x="70" y="370" font-size="15.5" fill="#6b7b6b">The mechanism is single and agreed, so moving it means something.</text><text x="70" y="398" font-size="15.0" fill="#b4532f">Excludes anything diffuse or contested.</text><line x1="656" y1="363.0" x2="700" y2="363.0" stroke="#b4532f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="710" y="369.0" font-size="15.0" fill="#9aaa9a">shed here</text><rect x="44" y="454" width="506" height="122" rx="6" fill="#f5f2ed" stroke="#eee8df" stroke-width="1"/><rect x="44" y="454" width="6" height="122" rx="3" fill="#2a5a3a"/><text x="70" y="492" font-size="21.0" font-weight="700" fill="#1a3a2a">A validated surrogate</text><text x="70" y="522" font-size="15.5" fill="#6b7b6b">Somebody established that moving the measure moves the outcome.</text><text x="70" y="550" font-size="15.0" fill="#b4532f">Excludes anything nobody qualified — and the queue to qualify is closed.</text><line x1="564" y1="515.0" x2="608" y2="515.0" stroke="#b4532f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="618" y="521.0" font-size="15.0" fill="#9aaa9a">shed here</text><rect x="44" y="618" width="1062" height="74" rx="6" fill="#fffdf8" stroke="#b4532f" stroke-width="1.6" stroke-dasharray="7 5"/><text x="70" y="649" font-size="19.0" font-weight="700" fill="#b4532f">Clear all three and medicine can tell you to stop.</text><text x="70" y="675" font-size="15.5" fill="#6b7b6b">Below the threshold, off the approval pathway, chasing something no biomarker was ever qualified for — nothing can.</text><line x1="44" y1="600" x2="1106" y2="600" stroke="#eee8df" stroke-width="1"/><text x="44" y="622" font-size="15" fill="#6b7b6b">Schematic of the argument, not data. Band widths are illustrative; no population is being quantified here.</text><text x="44" y="644" font-size="15" fill="#9aaa9a">insights.freshfoodrecs.com &#183; schematic &#183; August 2026</text></svg>