<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 884" width="1500" height="884" font-family="Source Sans 3, Segoe UI, Helvetica, Arial, sans-serif"><rect width="1500" height="884" fill="#fffdf8"/><text x="56" y="60" font-size="33" font-weight="700" fill="#1a3a2a">Science gets measured. Decisions don&#8217;t.</text><text x="56" y="96" font-size="16.5" fill="#6b7b6b">Every serious AI-for-science benchmark, placed at the question it actually answers. Bar length is how well instrumented that question is.</text><text x="56" y="140" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6b7b6b">STAGE</text><text x="430" y="140" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6b7b6b">HOW WELL WE CAN ANSWER IT</text><text x="56" y="195.0" font-size="17" font-weight="700" fill="#1a3a2a">Discovery</text><text x="56" y="215.0" font-size="13.5" fill="#6b7b6b">Can it find the right papers?</text><rect x="430" y="186.0" width="560" height="26" rx="4" fill="#f5f2ed" stroke="#eee8df" stroke-width="0.8"/><rect x="430" y="186.0" width="532" height="26" rx="4" fill="#2a5a3a"/><text x="1006" y="204.0" font-size="13.5" fill="#9aaa9a">LitQA2 · PaperFindingBench · ScholarQA</text><text x="56" y="267.0" font-size="17" font-weight="700" fill="#1a3a2a">Analysis</text><text x="56" y="287.0" font-size="13.5" fill="#6b7b6b">Does the code run and reproduce?</text><rect x="430" y="258.0" width="560" height="26" rx="4" fill="#f5f2ed" stroke="#eee8df" stroke-width="0.8"/><rect x="430" y="258.0" width="504" height="26" rx="4" fill="#2a5a3a"/><text x="1006" y="276.0" font-size="13.5" fill="#9aaa9a">DS-1000 · CORE-Bench · SUPER · ReplicationBench</text><text x="56" y="339.0" font-size="17" font-weight="700" fill="#1a3a2a">Experiment</text><text x="56" y="359.0" font-size="13.5" fill="#6b7b6b">Does the hypothesis match the gold?</text><rect x="430" y="330.0" width="560" height="26" rx="4" fill="#f5f2ed" stroke="#eee8df" stroke-width="0.8"/><rect x="430" y="330.0" width="308" height="26" rx="4" fill="#2a5a3a"/><text x="1006" y="348.0" font-size="13.5" fill="#9aaa9a">DiscoveryBench — best score 33.7</text><text x="56" y="411.0" font-size="17" font-weight="700" fill="#1a3a2a">Writing up</text><text x="56" y="431.0" font-size="13.5" fill="#6b7b6b">Is the draft any good?</text><rect x="430" y="402.0" width="560" height="26" rx="4" fill="#f5f2ed" stroke="#eee8df" stroke-width="0.8"/><rect x="430" y="402.0" width="252" height="26" rx="4" fill="#2a5a3a"/><text x="1006" y="420.0" font-size="13.5" fill="#9aaa9a">E2E-Bench · rubric-scored by an LLM</text><text x="56" y="483.0" font-size="17" font-weight="700" fill="#1a3a2a">Peer review</text><text x="56" y="503.0" font-size="13.5" fill="#6b7b6b">Would a reviewer be fooled?</text><rect x="430" y="474.0" width="560" height="26" rx="4" fill="#f5f2ed" stroke="#eee8df" stroke-width="0.8"/><rect x="430" y="474.0" width="336" height="26" rx="4" fill="#2a5a3a"/><text x="1006" y="492.0" font-size="13.5" fill="#9aaa9a">AI review pilots · gaming and hivemind studies</text><text x="56" y="555.0" font-size="17" font-weight="700" fill="#1a3a2a">Data quality</text><text x="56" y="575.0" font-size="13.5" fill="#6b7b6b">Will it flag what you didn't ask?</text><rect x="430" y="546.0" width="560" height="26" rx="4" fill="#f5f2ed" stroke="#eee8df" stroke-width="0.8"/><rect x="430" y="546.0" width="112" height="26" rx="4" fill="#c9a227"/><text x="1006" y="564.0" font-size="13.5" fill="#9aaa9a">bluffbench2 — best around 16%</text><text x="56" y="671.0" font-size="17" font-weight="700" fill="#1a3a2a">Translation</text><text x="56" y="691.0" font-size="13.5" fill="#6b7b6b">Did the answer change a decision?</text><rect x="430" y="662.0" width="560" height="26" rx="4" fill="#f5f2ed" stroke="#eee8df" stroke-width="0.8"/><rect x="430" y="662.0" width="28" height="26" rx="4" fill="#b4532f"/><text x="1006" y="680.0" font-size="13.5" fill="#9aaa9a">nothing measures this directly</text><text x="56" y="743.0" font-size="17" font-weight="700" fill="#1a3a2a">After</text><text x="56" y="763.0" font-size="13.5" fill="#6b7b6b">Did the decision hold up?</text><rect x="430" y="734.0" width="560" height="26" rx="4" fill="#f5f2ed" stroke="#eee8df" stroke-width="0.8"/><line x1="438" y1="747.0" x2="464" y2="747.0" stroke="#b4532f" stroke-width="2"/><text x="1006" y="752.0" font-size="13.5" fill="#9aaa9a">no VigiBase for models · no FAERS for models</text><line x1="56" y1="617.0" x2="1444" y2="617.0" stroke="#b4532f" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="56" y="605.0" width="320" height="24" rx="4" fill="#fffdf8"/><text x="62" y="622.0" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#b4532f">BELOW HERE, NOBODY IS KEEPING SCORE</text><line x1="56" y1="822" x2="1444" y2="822" stroke="#eee8df" stroke-width="1"/><text x="56" y="844" font-size="13" fill="#6b7b6b">Bar length is our reading of how directly each question is measured, not a published metric. The benchmarks named are real and cited in the essay.</text><text x="56" y="864" font-size="12.5" fill="#9aaa9a">insights.freshfoodrecs.com &#183; August 2026</text></svg>