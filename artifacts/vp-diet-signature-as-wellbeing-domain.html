<!doctype html>
<meta charset="utf-8">
<title>Composition: diet-signature as a well-being domain</title>
<!--
  COMPOSITION PROOF (composition_engine.md §4, internal x internal):
    "diet-signature viz + well-being domain viewer -> stack them, because
     nutrition is one domain within well-being."

  Primitive A = well-being-domain-panel  (Rhythm liferadar; 6 domains; blue)
  Primitive B = signature-radar          (fresh_diet render_radar_svg; polarity-split; green)
  Nesting     = the DIET spoke of A drills into B.

  Both are the SAME radial core parameterized differently — which is exactly
  why they compose. Click the gold "Diet" spoke to drill in; "< Well-being" to return.
  This single file inlines both primitives so it renders standalone.
-->
<style>
  :root{
    --ink:#1a3a2a; --ink-soft:#2a5a3a; --muted-soft:#9aaa9a;
    --paper:#fffdf8; --line:#ddd8cf; --line-soft:#eee8df;
    --accent-soft:#d4eddf; --ok:#2e7d5b; --danger:#a33a2a; --gold:#cb8a35;
    --wb:#002060; --wb-soft:#c9d3e6;
    --font-sans:'Source Sans 3','Segoe UI',sans-serif; --font-serif:'Lora',Georgia,serif;
  }
  body{background:var(--paper); margin:0; font-family:var(--font-sans); color:var(--ink);}
  .wrap{max-width:660px; margin:0 auto; padding:20px 12px;}
  .crumb{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-soft); min-height:30px;}
  .crumb button{font:inherit; color:var(--wb); background:none; border:none; cursor:pointer; padding:4px 6px; border-radius:6px;}
  .crumb button:hover{background:var(--wb-soft);}
  .crumb .sep{color:var(--muted-soft);}
  .crumb b{color:var(--ink);}
  h1{font-family:var(--font-serif); font-weight:600; font-size:21px; margin:.15em 0;}
  p.sub{color:var(--ink-soft); margin:.15em 0 .6em; font-size:14px;}
  .radar{width:100%; height:auto; display:block;}
  .radar .ring{fill:none; stroke:var(--line-soft); stroke-width:1; stroke-dasharray:2 3;}
  .radar .ring-1{stroke:var(--line); stroke-dasharray:none;}
  .radar .axis-line{stroke:var(--line); stroke-width:1.25; stroke-linecap:round;}
  /* well-being (A) */
  .radar .wb-fill{fill:var(--wb-soft); fill-opacity:.5; stroke:var(--wb); stroke-width:2; stroke-linejoin:round;}
  .radar .vertex{fill:var(--wb);}
  .radar text.domain{fill:var(--ink); font-size:15px; font-weight:500; cursor:default;}
  .radar text.domain.drillable{font-weight:700; cursor:pointer;}
  .radar text.domain.drillable:hover{fill:var(--gold);}
  .radar .drill-ring{fill:none; stroke:var(--gold); stroke-width:2; stroke-dasharray:3 3; cursor:pointer;}
  /* signature (B) */
  .radar .signature{fill:var(--accent-soft); fill-opacity:.55; stroke:var(--ink); stroke-width:2; stroke-linejoin:round;}
  .radar .vertex-sig{fill:var(--ink-soft);}
  .radar text.encourage{fill:var(--ink); font-size:14px; font-weight:500;}
  .radar text.limit{fill:var(--danger); font-size:14px; font-weight:600;}
</style>

<div class="wrap">
  <div class="crumb" id="crumb"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <svg class="radar" id="radar" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<script>
/* ================= shared radial core ================= */
var R = (function () {
  var NS="http://www.w3.org/2000/svg", CX=250, CY=250, RMAX=180, FLOOR=0.03, VIEWBOX="-70 0 640 500";
  function el(n,a,t){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e;}
  function rad(d){return d*Math.PI/180;}
  function vert(deg,v){var a=rad(deg),r=RMAX*Math.max(0,Math.min(1,v));return {x:CX+r*Math.sin(a),y:CY-r*Math.cos(a)};}
  function splinePath(pts,t){var n=pts.length;if(n<3)return"";if(t==null)t=0.5;
    function prv(i){return i===0?n-1:i-1;}function nxt(i){return i===n-1?0:i+1;}
    var d="M "+pts[0].x.toFixed(2)+" "+pts[0].y.toFixed(2);
    for(var i=0;i<n;i++){var j=nxt(i);
      var c1x=pts[i].x+t*(pts[j].x-pts[prv(i)].x)/3,c1y=pts[i].y+t*(pts[j].y-pts[prv(i)].y)/3;
      var c2x=pts[j].x-t*(pts[nxt(j)].x-pts[i].x)/3,c2y=pts[j].y-t*(pts[nxt(j)].y-pts[i].y)/3;
      d+=" C "+c1x.toFixed(2)+" "+c1y.toFixed(2)+", "+c2x.toFixed(2)+" "+c2y.toFixed(2)+", "+pts[j].x.toFixed(2)+" "+pts[j].y.toFixed(2);}
    return d+" Z";}
  function rings(svg){svg.setAttribute("viewBox",VIEWBOX);[45,90,135,180].forEach(function(r){svg.appendChild(el("circle",{cx:CX,cy:CY,r:r,"class":"ring"+(r===180?" ring-1":"")}));});}
  function ticks(svg,degs){degs.forEach(function(dg){var a=rad(dg);svg.appendChild(el("line",{x1:(CX+RMAX*Math.sin(a)).toFixed(1),y1:(CY-RMAX*Math.cos(a)).toFixed(1),x2:(CX+(RMAX+14)*Math.sin(a)).toFixed(1),y2:(CY-(RMAX+14)*Math.cos(a)).toFixed(1),"class":"axis-line"}));});}
  return {el:el,rad:rad,vert:vert,splinePath:splinePath,rings:rings,ticks:ticks,CX:CX,CY:CY,RMAX:RMAX,FLOOR:FLOOR};
})();
function clear(svg){while(svg.firstChild)svg.removeChild(svg.firstChild);}

/* ================= primitive A: well-being-domain-panel ================= */
var DOMAINS=[{key:"sleep",label:"Sleep 😴"},{key:"diet",label:"Diet 🥗",drillable:true},{key:"activity",label:"Activity 🏃"},{key:"mind",label:"Mind 🧠"},{key:"selfcare",label:"Self-Care 🛀"},{key:"social",label:"Social 👪"}];
var WB={sleep:.64,diet:.71,activity:.52,mind:.60,selfcare:.45,social:.68};
function drawWellbeing(svg,onDrill){
  clear(svg); R.rings(svg);
  var n=DOMAINS.length; DOMAINS.forEach(function(d,i){d.deg=360*i/n;});
  R.ticks(svg,DOMAINS.map(function(d){return d.deg;}));
  var pts=DOMAINS.map(function(d){return R.vert(d.deg,Math.max(R.FLOOR,WB[d.key]));});
  svg.appendChild(R.el("path",{"class":"wb-fill",d:R.splinePath(pts,0.5)}));
  DOMAINS.forEach(function(d){var p=R.vert(d.deg,Math.max(R.FLOOR,WB[d.key]));
    svg.appendChild(R.el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:d.drillable?5:3.5,"class":"vertex"}));
    if(d.drillable){var ring=R.el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:9,"class":"drill-ring"});ring.addEventListener("click",onDrill);svg.appendChild(ring);}});
  DOMAINS.forEach(function(d){var a=R.rad(d.deg),rl=R.RMAX+22,xl=R.CX+rl*Math.sin(a),yl=R.CY-rl*Math.cos(a);
    var yoff=yl<R.CY?-2:14,anchor=Math.abs(xl-R.CX)<6?"middle":(xl>R.CX?"start":"end");
    var t=R.el("text",{x:xl.toFixed(1),y:(yl+yoff).toFixed(1),"class":"domain"+(d.drillable?" drillable":""),"text-anchor":anchor},d.label);
    if(d.drillable)t.addEventListener("click",onDrill); svg.appendChild(t);});
}

/* ================= primitive B: signature-radar (the Diet drill-in) ================= */
var DEFS=[{key:"protein",label:"Protein",pol:"encourage"},{key:"fiber",label:"Fiber",pol:"encourage"},{key:"fruits",label:"Fruits",pol:"encourage",emoji:"🍎"},{key:"vegetables",label:"Vegetables",pol:"encourage",emoji:"🥬"},{key:"wholegrain",label:"Whole grains",pol:"encourage",emoji:"🌾"},{key:"satfat",label:"Saturated fat",pol:"limit"},{key:"sodium",label:"Sodium",pol:"limit",emoji:"🧂"},{key:"sugary",label:"Sugary drinks",pol:"limit",emoji:"🥤"}];
var SIG={protein:.72,fiber:.61,fruits:.55,vegetables:.80,wholegrain:.48,satfat:.35,sodium:.58,sugary:.22};
function placeByPolarity(defs){
  var enc=defs.filter(function(d){return d.pol!=="limit";}),lim=defs.filter(function(d){return d.pol==="limit";}),axes={};
  function spread(list,from,to){var n=list.length;list.forEach(function(d,i){axes[d.key]={label:d.label,emoji:d.emoji||"",pol:d.pol,deg:n===1?(from+to)/2:from+(to-from)*i/(n-1)};});}
  spread(enc,-70,70); spread(lim,110,250); return axes;
}
function drawSignature(svg){
  clear(svg); R.rings(svg);
  var axes=placeByPolarity(DEFS), order=DEFS.map(function(d){return d.key;});
  var byDeg=order.slice().sort(function(a,b){return axes[a].deg-axes[b].deg;});
  R.ticks(svg,byDeg.map(function(k){return axes[k].deg;}));
  var pts=byDeg.map(function(k){return R.vert(axes[k].deg,Math.max(R.FLOOR,SIG[k]));});
  svg.appendChild(R.el("path",{"class":"signature",d:R.splinePath(pts,0.5)}));
  byDeg.forEach(function(k){var p=R.vert(axes[k].deg,Math.max(R.FLOOR,SIG[k]));svg.appendChild(R.el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:3.5,"class":"vertex-sig"}));});
  byDeg.forEach(function(k){var ax=axes[k],a=R.rad(ax.deg),rl=R.RMAX+22,xl=R.CX+rl*Math.sin(a),yl=R.CY-rl*Math.cos(a);
    var yoff=yl<R.CY?-2:12,anchor=Math.abs(xl-R.CX)<6?"middle":(xl>R.CX?"start":"end");
    svg.appendChild(R.el("text",{x:xl.toFixed(1),y:(yl+yoff).toFixed(1),"class":ax.pol==="limit"?"limit":"encourage","text-anchor":anchor},(ax.emoji?ax.emoji+" ":"")+ax.label));});
}

/* ================= view state / drill navigation ================= */
var svg=document.getElementById("radar"), crumb=document.getElementById("crumb"),
    title=document.getElementById("title"), sub=document.getElementById("sub");
function showWellbeing(){
  crumb.innerHTML='<b>Well-being</b>';
  title.textContent="Well-being";
  sub.innerHTML='six life domains &middot; click the gold <b style="color:var(--gold)">Diet</b> spoke to drill into the diet signature';
  drawWellbeing(svg, showDiet);
}
function showDiet(){
  crumb.innerHTML='';
  var back=document.createElement("button"); back.textContent="‹ Well-being"; back.addEventListener("click",showWellbeing);
  crumb.appendChild(back);
  var sep=document.createElement("span"); sep.className="sep"; sep.textContent="›"; crumb.appendChild(sep);
  var here=document.createElement("b"); here.textContent="Diet signature"; crumb.appendChild(here);
  title.textContent="Diet signature";
  sub.innerHTML='one well-being domain, expanded &middot; encourage axes up, limit axes down';
  drawSignature(svg);
}
showWellbeing();
</script>
