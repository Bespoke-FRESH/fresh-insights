<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Diet signature as a well-being domain — the drill transition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Composition: the well-being wheel (primitive A) whose DIET spoke OPENS into the
  diet signature (primitive B). The animation is the LEVEL TRANSITION between the
  two views: the five non-diet domains recede, the Diet spoke is held, then it fans
  out into the diet-signature axes as the polygon morphs blue → green — narrated
  beat by beat. Both are the same radial core, which is why one morphs into the other.
  Self-contained; draw core ported from fresh_diet onb_radar.js.
-->
<style>
  :root{
    --ink:#1a3a2a; --ink-soft:#2a5a3a; --muted-soft:#9aaa9a;
    --paper:#fffdf8; --line:#ddd8cf; --line-soft:#eee8df;
    --accent-soft:#d4eddf; --ok:#2e7d5b; --danger:#a33a2a; --gold:#cb8a35;
    --wb:#002060; --wb-soft:#c9d3e6;
    --font-sans:'Source Sans 3','Segoe UI',sans-serif; --font-serif:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box;}
  body{background:var(--paper); margin:0; font-family:var(--font-sans); color:var(--ink);}
  .wrap{max-width:660px; margin:0 auto; padding:18px 12px 26px;}
  .crumb{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-soft); min-height:30px;}
  .crumb button{font:inherit; color:var(--wb); background:none; border:none; cursor:pointer; padding:4px 6px; border-radius:6px;}
  .crumb button:hover{background:var(--wb-soft);}
  .crumb .sep{color:var(--muted-soft);} .crumb b{color:var(--ink);}
  h1{font-family:var(--font-serif); font-weight:600; font-size:21px; margin:.15em 0;}
  p.sub{color:var(--ink-soft); margin:.15em 0 .5em; font-size:14px;}
  .radar{width:100%; height:auto; display:block;}
  .radar .ring{fill:none; stroke:var(--line-soft); stroke-width:1; stroke-dasharray:2 3;}
  .radar .ring-1{stroke:var(--line); stroke-dasharray:none;}
  .radar .axis-line{stroke:var(--line); stroke-width:1.25; stroke-linecap:round;}
  .radar .wb-fill{fill:var(--wb-soft); fill-opacity:.5; stroke:var(--wb); stroke-width:2; stroke-linejoin:round;}
  .radar .vertex{fill:var(--wb);}
  .radar text.domain{fill:var(--ink); font-size:15px; font-weight:500;}
  .radar text.domain.diet{font-weight:700;}
  .radar .drill-ring{fill:none; stroke:var(--gold); stroke-width:2; stroke-dasharray:3 3; cursor:pointer;}
  .radar .signature{fill:var(--accent-soft); fill-opacity:.55; stroke:var(--ink); stroke-width:2; stroke-linejoin:round;}
  .radar .vertex-sig{fill:var(--ink-soft);}
  .radar text.axlab{font-size:13.5px; font-weight:500;}
  .radar text.axlab.limit{fill:var(--danger); font-weight:600;}
  .radar text.axlab.enc{fill:var(--ink);}
  @keyframes haloPulse{0%,100%{transform:scale(.7);opacity:.85} 50%{transform:scale(1.5);opacity:.12}}
  .radar .fresh-halo{fill:none; stroke:var(--gold); stroke-width:2; transform-box:fill-box; transform-origin:center; animation:haloPulse 1.3s infinite;}
  .cap{min-height:42px; font-family:var(--font-serif); font-size:15.5px; line-height:1.45; color:var(--ink-soft); margin:4px 4px 0; text-align:center;}
  .cap b{color:var(--ink); font-weight:600;}
  .ctrls{display:flex; gap:6px; justify-content:center; margin-top:10px; opacity:0; transition:opacity .3s;}
  .ctrls.show{opacity:1;}
  .ctrls button{font:inherit; font-size:12.5px; color:var(--ink-soft); background:none; border:1px solid var(--line); border-radius:8px; padding:4px 12px; cursor:pointer;}
  .ctrls button:hover{background:var(--line-soft);}
  @media (prefers-reduced-motion: reduce){.radar .fresh-halo{animation:none;}}
</style>

<div class="wrap">
  <div class="crumb" id="crumb"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <svg class="radar" id="radar" xmlns="http://www.w3.org/2000/svg"></svg>
  <p class="cap" id="cap"></p>
  <div class="ctrls" id="ctrls">
    <button id="skip">Skip ↦</button>
    <button id="replay">↻ Replay</button>
  </div>
</div>

<script>
/* ================= shared radial core (ported from onb_radar.js) ============ */
var R = (function () {
  var NS="http://www.w3.org/2000/svg", CX=250, CY=250, RMAX=180, FLOOR=0.03, VIEWBOX="-70 0 640 500";
  function el(n,a,t){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e;}
  function rad(d){return d*Math.PI/180;}
  function vert(deg,v){var a=rad(deg),r=RMAX*Math.max(0,Math.min(1,v));return {x:CX+r*Math.sin(a),y:CY-r*Math.cos(a)};}
  function splinePath(pts,t){var n=pts.length;if(n<3)return"";if(t==null)t=0.5;
    function prv(i){return i===0?n-1:i-1;}function nxt(i){return i===n-1?0:i+1;}
    var d="M "+pts[0].x.toFixed(2)+" "+pts[0].y.toFixed(2);
    for(var i=0;i<n;i++){var j=nxt(i);
      var c1x=pts[i].x+t*(pts[j].x-pts[prv(i)].x)/3,c1y=pts[i].y+t*(pts[j].y-pts[prv(i)].y)/3;
      var c2x=pts[j].x-t*(pts[nxt(j)].x-pts[i].x)/3,c2y=pts[j].y-t*(pts[nxt(j)].y-pts[i].y)/3;
      d+=" C "+c1x.toFixed(2)+" "+c1y.toFixed(2)+", "+c2x.toFixed(2)+" "+c2y.toFixed(2)+", "+pts[j].x.toFixed(2)+" "+pts[j].y.toFixed(2);}
    return d+" Z";}
  function rings(svg){svg.setAttribute("viewBox",VIEWBOX);[45,90,135,180].forEach(function(r){svg.appendChild(el("circle",{cx:CX,cy:CY,r:r,"class":"ring"+(r===180?" ring-1":"")}));});}
  function ticks(svg,degs){degs.forEach(function(dg){var a=rad(dg);svg.appendChild(el("line",{x1:(CX+RMAX*Math.sin(a)).toFixed(1),y1:(CY-RMAX*Math.cos(a)).toFixed(1),x2:(CX+(RMAX+14)*Math.sin(a)).toFixed(1),y2:(CY-(RMAX+14)*Math.cos(a)).toFixed(1),"class":"axis-line"}));});}
  return {el:el,rad:rad,vert:vert,splinePath:splinePath,rings:rings,ticks:ticks,CX:CX,CY:CY,RMAX:RMAX,FLOOR:FLOOR};
})();
function clear(svg){while(svg.firstChild)svg.removeChild(svg.firstChild);}

/* ================= data: well-being (A) + diet signature (B) ================ */
var DOMAINS=[{key:"sleep",label:"Sleep 😴"},{key:"diet",label:"Diet 🥗"},{key:"activity",label:"Activity 🏃"},{key:"mind",label:"Mind 🧠"},{key:"selfcare",label:"Self-Care 🛀"},{key:"social",label:"Social 👪"}];
var WB={sleep:.64,diet:.71,activity:.52,mind:.60,selfcare:.45,social:.68};
var DIET_DEG=60;   // Diet is domain index 1 → 60°
var DEFS=[{key:"protein",label:"Protein",pol:"enc"},{key:"fiber",label:"Fiber",pol:"enc"},{key:"fruits",label:"Fruits",pol:"enc",emoji:"🍎"},{key:"vegetables",label:"Vegetables",pol:"enc",emoji:"🥬"},{key:"wholegrain",label:"Whole grains",pol:"enc",emoji:"🌾"},{key:"satfat",label:"Saturated fat",pol:"lim"},{key:"sodium",label:"Sodium",pol:"lim",emoji:"🧂"},{key:"sugary",label:"Sugary drinks",pol:"lim",emoji:"🥤"}];
var SIG={protein:.72,fiber:.61,fruits:.55,vegetables:.80,wholegrain:.48,satfat:.35,sodium:.58,sugary:.22};
var SIGDEG=(function(){var enc=DEFS.filter(function(d){return d.pol!=="lim";}),lim=DEFS.filter(function(d){return d.pol==="lim";}),o={};
  function spread(list,from,to){var n=list.length;list.forEach(function(d,i){o[d.key]=n===1?(from+to)/2:from+(to-from)*i/(n-1);});}
  spread(enc,-70,70); spread(lim,110,250); return o;})();

/* ================= static well-being resting view (drillable) =============== */
function drawWellbeing(svg,onDrill){
  clear(svg); R.rings(svg);
  DOMAINS.forEach(function(d,i){d.deg=60*i;});
  R.ticks(svg,DOMAINS.map(function(d){return d.deg;}));
  var pts=DOMAINS.map(function(d){return R.vert(d.deg,Math.max(R.FLOOR,WB[d.key]));});
  svg.appendChild(R.el("path",{"class":"wb-fill",d:R.splinePath(pts,0.5)}));
  DOMAINS.forEach(function(d){var p=R.vert(d.deg,Math.max(R.FLOOR,WB[d.key])),diet=(d.key==="diet");
    svg.appendChild(R.el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:diet?5:3.5,"class":"vertex"}));
    if(diet){var ring=R.el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:9,"class":"drill-ring"});ring.addEventListener("click",onDrill);svg.appendChild(ring);}});
  DOMAINS.forEach(function(d){var a=R.rad(d.deg),rl=R.RMAX+22,xl=R.CX+rl*Math.sin(a),yl=R.CY-rl*Math.cos(a),diet=(d.key==="diet");
    var yoff=yl<R.CY?-2:14,anchor=Math.abs(xl-R.CX)<6?"middle":(xl>R.CX?"start":"end");
    var t=R.el("text",{x:xl.toFixed(1),y:(yl+yoff).toFixed(1),"class":"domain"+(diet?" diet":""),"text-anchor":anchor},d.label);
    if(diet){t.style.cursor="pointer"; t.style.fill="var(--gold)"; t.addEventListener("click",onDrill);} svg.appendChild(t);});
}

/* ================= the LEVEL-TRANSITION morph (well-being → diet) ============ */
// One animated state map. wb_* domains + sig_* axes; each {deg,val,op,foc}.
// POLY = the two polygons' fade (wb blue → sig green). Beats tween the whole thing.
var A={}, POLY={wb:1,sig:0};
function initTransition(){
  A={}; POLY={wb:1,sig:0};
  DOMAINS.forEach(function(d,i){A["wb_"+d.key]={kind:"wb",deg:60*i,val:WB[d.key],op:1,foc:1,label:d.label,diet:(d.key==="diet")};});
  DEFS.forEach(function(d){A["sig_"+d.key]={kind:"sig",deg:DIET_DEG,val:WB.diet,op:0,foc:1,   // start clustered at the Diet spoke
    label:(d.emoji?d.emoji+" ":"")+d.label,pol:d.pol,endDeg:SIGDEG[d.key],endVal:SIG[d.key]};});
}
function endTransition(){ // settled signature
  DOMAINS.forEach(function(d){if(A["wb_"+d.key])A["wb_"+d.key].op=0;});
  DEFS.forEach(function(d){var s=A["sig_"+d.key];s.deg=s.endDeg;s.val=s.endVal;s.op=1;s.foc=1;});
  POLY.wb=0; POLY.sig=1;
}

function snapshot(){var s={A:{},P:{wb:POLY.wb,sig:POLY.sig}};for(var k in A)s.A[k]={deg:A[k].deg,val:A[k].val,op:A[k].op,foc:A[k].foc};return s;}
function restore(s){for(var k in s.A){A[k].deg=s.A[k].deg;A[k].val=s.A[k].val;A[k].op=s.A[k].op;A[k].foc=s.A[k].foc;}POLY.wb=s.P.wb;POLY.sig=s.P.sig;}
function lerpTo(from,to,e){for(var k in A){var f=from.A[k],t=to.A[k];
  A[k].deg=f.deg+(t.deg-f.deg)*e; A[k].val=f.val+(t.val-f.val)*e; A[k].op=f.op+(t.op-f.op)*e; A[k].foc=f.foc+(t.foc-f.foc)*e;}
  POLY.wb=from.P.wb+(to.P.wb-from.P.wb)*e; POLY.sig=from.P.sig+(to.P.sig-from.P.sig)*e;}

var svg,capEl,ctrls,crumb,title,sub,timer=null,killed=false;
var STEP=40,TW=780; var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function ease(p){return p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;}

function present(kind){return Object.keys(A).filter(function(k){return A[k].kind===kind&&A[k].op>0.35;}).sort(function(a,b){return A[a].deg-A[b].deg;});}
function renderFrame(halos){
  clear(svg); R.rings(svg);
  var wbK=present("wb"), sigK=present("sig");
  var degs={}; wbK.concat(sigK).forEach(function(k){degs[Math.round(A[k].deg)]=A[k].deg;});
  R.ticks(svg,Object.keys(degs).map(function(d){return degs[d];}));
  // polygons (element opacity = crossfade)
  if(wbK.length>=3 && POLY.wb>0.01){var wp=wbK.map(function(k){return R.vert(A[k].deg,Math.max(R.FLOOR,A[k].val));});
    svg.appendChild(R.el("path",{"class":"wb-fill",d:R.splinePath(wp,0.5),opacity:POLY.wb.toFixed(3)}));}
  if(sigK.length>=3 && POLY.sig>0.01){var sp=sigK.map(function(k){return R.vert(A[k].deg,Math.max(R.FLOOR,A[k].val));});
    svg.appendChild(R.el("path",{"class":"signature",d:R.splinePath(sp,0.5),opacity:POLY.sig.toFixed(3)}));}
  // vertices + labels
  wbK.forEach(function(k){var p=R.vert(A[k].deg,Math.max(R.FLOOR,A[k].val)),o=(A[k].op*A[k].foc).toFixed(3);
    svg.appendChild(R.el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:A[k].diet?5:3.5,"class":"vertex",opacity:o}));
    var a=R.rad(A[k].deg),rl=R.RMAX+22,xl=R.CX+rl*Math.sin(a),yl=R.CY-rl*Math.cos(a),yoff=yl<R.CY?-2:14,anc=Math.abs(xl-R.CX)<6?"middle":(xl>R.CX?"start":"end");
    var t=R.el("text",{x:xl.toFixed(1),y:(yl+yoff).toFixed(1),"class":"domain"+(A[k].diet?" diet":""),"text-anchor":anc,opacity:o},A[k].label);
    if(A[k].diet)t.style.fill="var(--gold)"; svg.appendChild(t);});
  sigK.forEach(function(k){var p=R.vert(A[k].deg,Math.max(R.FLOOR,A[k].val)),o=A[k].op.toFixed(3);
    svg.appendChild(R.el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:3.5,"class":"vertex-sig",opacity:o}));
    var a=R.rad(A[k].deg),rl=R.RMAX+22,xl=R.CX+rl*Math.sin(a),yl=R.CY-rl*Math.cos(a),yoff=yl<R.CY?-2:12,anc=Math.abs(xl-R.CX)<6?"middle":(xl>R.CX?"start":"end");
    svg.appendChild(R.el("text",{x:xl.toFixed(1),y:(yl+yoff).toFixed(1),"class":"axlab "+(A[k].pol==="lim"?"limit":"enc"),"text-anchor":anc,opacity:o},A[k].label));});
  (halos||[]).forEach(function(k){if(A[k]&&A[k].op>0.2){var p=R.vert(A[k].deg,Math.max(R.FLOOR,A[k].val));
    svg.appendChild(R.el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:11,"class":"fresh-halo"}));}});
}
function setCap(html){capEl.innerHTML=html;}

// Beats: each mutates A/POLY to its TARGET (we snapshot before, tween into it).
var BEATS=[
 {cap:"<b>Diet</b> is one of your six well-being domains.", halo:["wb_diet"], hold:2000,
  to:function(){Object.keys(A).forEach(function(k){if(A[k].kind==="wb")A[k].foc=A[k].diet?1:0.16;});}},
 {cap:"Zoom in on it — the others step back.", halo:["wb_diet"], hold:1900,
  to:function(){Object.keys(A).forEach(function(k){if(A[k].kind==="wb"&&!A[k].diet){A[k].val=0;A[k].op=0;}});}},
 {cap:"— and it opens into your <b>diet signature</b>.", halo:[], hold:2400,
  to:function(){DEFS.forEach(function(d){var s=A["sig_"+d.key];s.deg=s.endDeg;s.val=s.endVal;s.op=1;});A["wb_diet"].op=0;POLY.wb=0;POLY.sig=1;}},
 {cap:"Your <b>diet signature</b> — encourage axes up, limit axes down.", halo:[], settle:true, hold:0, to:function(){}}
];

function runBeat(i){
  if(i>=BEATS.length){finish();return;}
  var b=BEATS[i]; setCap(b.cap);
  var from=snapshot(); b.to(); var to=snapshot(); restore(from);
  var t0=Date.now();
  (function frame(){ if(killed)return;
    var p=Math.min(1,(Date.now()-t0)/(RM?1:TW)), e=ease(p);
    lerpTo(from,to,e); renderFrame(b.halo);
    if(p<1){timer=setTimeout(frame,STEP);}
    else{restore(to); renderFrame(b.halo);
      if(b.settle){finish();return;}
      timer=setTimeout(function(){runBeat(i+1);}, RM?0:b.hold);}
  })();
}
function finish(){ endTransition(); renderFrame([]); setCap("Your <b>diet signature</b> — encourage axes up, limit axes down."); ctrls.classList.add("show"); }

function playTransition(){
  if(timer)clearTimeout(timer); killed=true; setTimeout(function(){killed=false;
    initTransition(); ctrls.classList.add("show");
    if(RM){endTransition();renderFrame([]);setCap("Your <b>diet signature</b> — encourage axes up, limit axes down.");return;}
    renderFrame(["wb_diet"]); setCap("<b>Diet</b> is one of your six well-being domains.");
    timer=setTimeout(function(){runBeat(0);}, 700);
  },0);
}
function jumpEnd(){ if(timer)clearTimeout(timer); killed=true; setTimeout(function(){killed=false; initTransition(); finish();},0); }

/* ================= view state / drill navigation ============================ */
function showWellbeing(){
  if(timer)clearTimeout(timer); killed=true; ctrls.classList.remove("show"); setCap("");
  crumb.innerHTML='<b>Well-being</b>';
  title.textContent="Well-being";
  sub.innerHTML='six life domains &middot; click the gold <b style="color:var(--gold)">Diet</b> spoke to open the diet signature';
  setTimeout(function(){killed=false; drawWellbeing(svg, showDiet);},0);
}
function showDiet(){
  crumb.innerHTML='';
  var back=document.createElement("button"); back.textContent="‹ Well-being"; back.addEventListener("click",showWellbeing);
  crumb.appendChild(back);
  var sep=document.createElement("span"); sep.className="sep"; sep.textContent="›"; crumb.appendChild(sep);
  var here=document.createElement("b"); here.textContent="Diet signature"; crumb.appendChild(here);
  title.textContent="Diet signature";
  sub.innerHTML='one well-being domain, opened up into its own signature';
  playTransition();
}

document.addEventListener("DOMContentLoaded",function(){
  svg=document.getElementById("radar"); capEl=document.getElementById("cap");
  ctrls=document.getElementById("ctrls"); crumb=document.getElementById("crumb");
  title=document.getElementById("title"); sub=document.getElementById("sub");
  document.getElementById("skip").addEventListener("click",jumpEnd);
  document.getElementById("replay").addEventListener("click",playTransition);
  showWellbeing();
});
</script>
</html>
