<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Diet signature as a well-being domain — with the onboarding morph</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Composition: the well-being wheel (primitive A) whose DIET spoke drills into the
  diet signature (primitive B). The drill-in reproduces the fresh_diet onboarding
  "Cronometer unlock" morph: the six food groups you sketched morph into the Expert
  nutrient signature — sugary drinks → added sugars, whole grains → fibre, then the
  encourage/limit nutrient cascades — narrated one beat at a time beneath the radar.
  Self-contained; ports the onb_radar draw core + the onb_unlock beat/caption model.
-->
<style>
  :root{
    --ink:#1a3a2a; --ink-soft:#2a5a3a; --muted-soft:#9aaa9a;
    --paper:#fffdf8; --line:#ddd8cf; --line-soft:#eee8df;
    --accent-soft:#d4eddf; --ok:#2e7d5b; --danger:#a33a2a; --gold:#cb8a35;
    --wb:#002060; --wb-soft:#c9d3e6;
    --font-sans:'Source Sans 3','Segoe UI',sans-serif; --font-serif:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box;}
  body{background:var(--paper); margin:0; font-family:var(--font-sans); color:var(--ink);}
  .wrap{max-width:660px; margin:0 auto; padding:18px 12px 26px;}
  .crumb{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-soft); min-height:30px;}
  .crumb button{font:inherit; color:var(--wb); background:none; border:none; cursor:pointer; padding:4px 6px; border-radius:6px;}
  .crumb button:hover{background:var(--wb-soft);}
  .crumb .sep{color:var(--muted-soft);} .crumb b{color:var(--ink);}
  h1{font-family:var(--font-serif); font-weight:600; font-size:21px; margin:.15em 0;}
  p.sub{color:var(--ink-soft); margin:.15em 0 .5em; font-size:14px;}
  .radar{width:100%; height:auto; display:block;}
  .radar .ring{fill:none; stroke:var(--line-soft); stroke-width:1; stroke-dasharray:2 3;}
  .radar .ring-1{stroke:var(--line); stroke-dasharray:none;}
  .radar .axis-line{stroke:var(--line); stroke-width:1.25; stroke-linecap:round;}
  .radar .wb-fill{fill:var(--wb-soft); fill-opacity:.5; stroke:var(--wb); stroke-width:2; stroke-linejoin:round;}
  .radar .vertex{fill:var(--wb);}
  .radar text.domain{fill:var(--ink); font-size:15px; font-weight:500; cursor:default;}
  .radar text.domain.drillable{font-weight:700; cursor:pointer;}
  .radar text.domain.drillable:hover{fill:var(--gold);}
  .radar .drill-ring{fill:none; stroke:var(--gold); stroke-width:2; stroke-dasharray:3 3; cursor:pointer;}
  .radar .signature{fill:var(--accent-soft); fill-opacity:.55; stroke:var(--ink); stroke-width:2; stroke-linejoin:round; transition:fill-opacity .3s;}
  .radar .vertex-sig{fill:var(--ink-soft);}
  .radar text.axlab{font-size:13.5px; font-weight:500; transition:fill-opacity .25s;}
  .radar text.axlab.limit{fill:var(--danger); font-weight:600;}
  .radar text.axlab.enc{fill:var(--ink);}
  @keyframes haloPulse{0%,100%{transform:scale(.7);opacity:.85} 50%{transform:scale(1.5);opacity:.12}}
  .radar .fresh-halo{fill:none; stroke:var(--gold); stroke-width:2; transform-box:fill-box; transform-origin:center; animation:haloPulse 1.3s infinite;}
  /* narration + controls */
  .cap{min-height:44px; font-family:var(--font-serif); font-size:15.5px; line-height:1.45; color:var(--ink-soft); margin:4px 4px 0; text-align:center;}
  .cap.tone-limit{color:var(--danger);} .cap.tone-encourage{color:var(--ok);}
  .cap b{color:var(--ink); font-weight:600;}
  .ctrls{display:flex; gap:6px; justify-content:center; margin-top:10px; opacity:0; transition:opacity .3s;}
  .ctrls.show{opacity:1;}
  .ctrls button{font:inherit; font-size:12.5px; color:var(--ink-soft); background:none; border:1px solid var(--line); border-radius:8px; padding:4px 12px; cursor:pointer;}
  .ctrls button:hover{background:var(--line-soft);}
  @media (prefers-reduced-motion: reduce){.radar .fresh-halo{animation:none;}}
</style>

<div class="wrap">
  <div class="crumb" id="crumb"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <svg class="radar" id="radar" xmlns="http://www.w3.org/2000/svg"></svg>
  <p class="cap" id="cap"></p>
  <div class="ctrls" id="ctrls">
    <button id="skip">Skip ↦</button>
    <button id="replay">↻ Replay</button>
  </div>
</div>

<script>
/* ================= shared radial core (ported from onb_radar.js) ============ */
var R = (function () {
  var NS="http://www.w3.org/2000/svg", CX=250, CY=250, RMAX=180, FLOOR=0.03, VIEWBOX="-70 0 640 500";
  function el(n,a,t){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e;}
  function rad(d){return d*Math.PI/180;}
  function vert(deg,v){var a=rad(deg),r=RMAX*Math.max(0,Math.min(1,v));return {x:CX+r*Math.sin(a),y:CY-r*Math.cos(a)};}
  function splinePath(pts,t){var n=pts.length;if(n<3)return"";if(t==null)t=0.5;
    function prv(i){return i===0?n-1:i-1;}function nxt(i){return i===n-1?0:i+1;}
    var d="M "+pts[0].x.toFixed(2)+" "+pts[0].y.toFixed(2);
    for(var i=0;i<n;i++){var j=nxt(i);
      var c1x=pts[i].x+t*(pts[j].x-pts[prv(i)].x)/3,c1y=pts[i].y+t*(pts[j].y-pts[prv(i)].y)/3;
      var c2x=pts[j].x-t*(pts[nxt(j)].x-pts[i].x)/3,c2y=pts[j].y-t*(pts[nxt(j)].y-pts[i].y)/3;
      d+=" C "+c1x.toFixed(2)+" "+c1y.toFixed(2)+", "+c2x.toFixed(2)+" "+c2y.toFixed(2)+", "+pts[j].x.toFixed(2)+" "+pts[j].y.toFixed(2);}
    return d+" Z";}
  function rings(svg){svg.setAttribute("viewBox",VIEWBOX);[45,90,135,180].forEach(function(r){svg.appendChild(el("circle",{cx:CX,cy:CY,r:r,"class":"ring"+(r===180?" ring-1":"")}));});}
  function ticks(svg,degs){degs.forEach(function(dg){var a=rad(dg);svg.appendChild(el("line",{x1:(CX+RMAX*Math.sin(a)).toFixed(1),y1:(CY-RMAX*Math.cos(a)).toFixed(1),x2:(CX+(RMAX+14)*Math.sin(a)).toFixed(1),y2:(CY-(RMAX+14)*Math.cos(a)).toFixed(1),"class":"axis-line"}));});}
  return {el:el,rad:rad,vert:vert,splinePath:splinePath,rings:rings,ticks:ticks,CX:CX,CY:CY,RMAX:RMAX,FLOOR:FLOOR};
})();
function clear(svg){while(svg.firstChild)svg.removeChild(svg.firstChild);}

/* ================= primitive A: well-being-domain-panel ===================== */
var DOMAINS=[{key:"sleep",label:"Sleep 😴"},{key:"diet",label:"Diet 🥗",drillable:true},{key:"activity",label:"Activity 🏃"},{key:"mind",label:"Mind 🧠"},{key:"selfcare",label:"Self-Care 🛀"},{key:"social",label:"Social 👪"}];
var WB={sleep:.64,diet:.71,activity:.52,mind:.60,selfcare:.45,social:.68};
function drawWellbeing(svg,onDrill){
  clear(svg); R.rings(svg);
  var n=DOMAINS.length; DOMAINS.forEach(function(d,i){d.deg=360*i/n;});
  R.ticks(svg,DOMAINS.map(function(d){return d.deg;}));
  var pts=DOMAINS.map(function(d){return R.vert(d.deg,Math.max(R.FLOOR,WB[d.key]));});
  svg.appendChild(R.el("path",{"class":"wb-fill",d:R.splinePath(pts,0.5)}));
  DOMAINS.forEach(function(d){var p=R.vert(d.deg,Math.max(R.FLOOR,WB[d.key]));
    svg.appendChild(R.el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:d.drillable?5:3.5,"class":"vertex"}));
    if(d.drillable){var ring=R.el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:9,"class":"drill-ring"});ring.addEventListener("click",onDrill);svg.appendChild(ring);}});
  DOMAINS.forEach(function(d){var a=R.rad(d.deg),rl=R.RMAX+22,xl=R.CX+rl*Math.sin(a),yl=R.CY-rl*Math.cos(a);
    var yoff=yl<R.CY?-2:14,anchor=Math.abs(xl-R.CX)<6?"middle":(xl>R.CX?"start":"end");
    var t=R.el("text",{x:xl.toFixed(1),y:(yl+yoff).toFixed(1),"class":"domain"+(d.drillable?" drillable":""),"text-anchor":anchor},d.label);
    if(d.drillable)t.addEventListener("click",onDrill); svg.appendChild(t);});
}

/* ================= primitive B: the signature MORPH (onb_unlock reproduction) */
// Axis registry. Encourage placed across the top arc (-70..70), limit across the
// bottom (110..250) — the polarity split, so "fuller = healthier" on every axis.
var ENC=["protein","fiber","fruits","vegetables","nuts","fattyfish"];
var LIM=["satfat","sodium","addsugar"];
var META={
  fruits:{label:"Fruits",emoji:"🍎",pol:"enc"}, vegetables:{label:"Vegetables",emoji:"🥬",pol:"enc"},
  nuts:{label:"Nuts / seeds",emoji:"🥜",pol:"enc"}, fattyfish:{label:"Fatty fish",emoji:"🐟",pol:"enc"},
  wholegrain:{label:"Whole grains",emoji:"🌾",pol:"enc"},
  protein:{label:"Protein",emoji:"",pol:"enc"}, fiber:{label:"Fibre",emoji:"",pol:"enc"},
  sugary:{label:"Sugary drinks",emoji:"🥤",pol:"lim"}, addsugar:{label:"Added sugars",emoji:"🥤",pol:"lim"},
  satfat:{label:"Saturated fat",emoji:"",pol:"lim"}, sodium:{label:"Sodium",emoji:"🧂",pol:"lim"}
};
// END (Expert) angle for every axis that ends on the map.
var ENDDEG={};
(function(){function spread(list,from,to){var n=list.length;list.forEach(function(k,i){ENDDEG[k]=n===1?(from+to)/2:from+(to-from)*i/(n-1);});}
  spread(ENC,-70,70); spread(LIM,110,250);
  ENDDEG.sugary=ENDDEG.addsugar; ENDDEG.wholegrain=ENDDEG.fiber;   // the two that get replaced glide toward their successor's slot
})();
// The six food groups the user "sketched", at onboarding angles (60° apart).
var FFQ={fruits:{deg:0,val:.50}, vegetables:{deg:60,val:.68}, wholegrain:{deg:120,val:.46},
         sugary:{deg:180,val:.30}, nuts:{deg:240,val:.55}, fattyfish:{deg:300,val:.42}};
// Settled Expert values.
var ENDVAL={protein:.72,fiber:.60,fruits:.52,vegetables:.78,nuts:.55,fattyfish:.42,satfat:.38,sodium:.55,addsugar:.30};

// live per-axis state: {deg,val,op,foc}  op=presence, foc=focus (dim when <1)
var ST={};
function initState(){ST={};
  Object.keys(META).forEach(function(k){ST[k]={deg:(ENDDEG[k]!=null?ENDDEG[k]:0),val:0,op:0,foc:1};});
  Object.keys(FFQ).forEach(function(k){ST[k].deg=FFQ[k].deg; ST[k].val=FFQ[k].val; ST[k].op=1;});
}

// Beats: each merges target deltas into the state, sets a caption, focus + halos.
var LABELS={};   // runtime label overrides (relabel-in-place)
var BEATS=[
 {cap:"The six food groups you sketched.", tone:"", set:{}, hold:1800},
 {cap:"Now — onto your bigger map.", tone:"", hold:1900,
  set:{fruits:{deg:ENDDEG.fruits}, vegetables:{deg:ENDDEG.vegetables}, nuts:{deg:ENDDEG.nuts},
       fattyfish:{deg:ENDDEG.fattyfish}, wholegrain:{deg:ENDDEG.wholegrain}, sugary:{deg:ENDDEG.sugary},
       fruits_v:{}, vegetables_v:{}} },
 {cap:"🥤 <b>Sugary drinks</b> are now <b>added sugars</b> — to catch sugar everywhere you eat it, not just drinks.",
  tone:"limit", focus:["sugary"], halo:["sugary"], relabel:{sugary:"addsugar"}, set:{sugary:{val:.30}}, hold:2600},
 {cap:"🌾 <b>Whole grains</b> become <b>fibre</b> — the part of the grain that actually moves your blood sugar.",
  tone:"encourage", focus:["wholegrain","fiber"], halo:["fiber"],
  set:{wholegrain:{val:0,op:0}, fiber:{val:.60,op:1}}, hold:2600},
 {cap:"The nutrients you want <b>more</b> of.", tone:"encourage", halo:["protein"],
  set:{protein:{val:.72,op:1}}, hold:2200},
 {cap:"… and the ones to <b>keep an eye on</b>.", tone:"limit", halo:["satfat","sodium"],
  set:{satfat:{val:.38,op:1}, sodium:{val:.55,op:1}}, hold:2400},
 {cap:"", tone:"", set:{}, settle:true, hold:0}
];

var STEP=40, TW=720, HOLD=1750;
function ease(p){return p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;}
var svg,capEl,ctrls,timer=null,rafKilled=false,beatIx=0;
var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;

function presentKeys(){return Object.keys(ST).filter(function(k){return ST[k].op>0.35;})
  .sort(function(a,b){return ST[a].deg-ST[b].deg;});}
function labelOf(k){var m=META[LABELS[k]||k];return (m.emoji?m.emoji+" ":"")+m.label;}
function polOf(k){return META[LABELS[k]||k].pol;}

function place(halos){
  clear(svg); R.rings(svg);
  var keys=presentKeys();
  R.ticks(svg, keys.map(function(k){return ST[k].deg;}));
  var pts=keys.map(function(k){return R.vert(ST[k].deg, Math.max(R.FLOOR, ST[k].val));});
  // dim whole polygon when any axis is focused
  var anyFoc=Object.keys(ST).some(function(k){return ST[k].op>0.35 && ST[k].foc<1;});
  var poly=R.el("path",{"class":"signature",d:R.splinePath(pts,0.5)});
  if(anyFoc) poly.setAttribute("fill-opacity",".28");
  svg.appendChild(poly);
  keys.forEach(function(k){var p=R.vert(ST[k].deg,Math.max(R.FLOOR,ST[k].val));
    svg.appendChild(R.el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:3.5,"class":"vertex-sig","fill-opacity":ST[k].foc}));});
  keys.forEach(function(k){var a=R.rad(ST[k].deg),rl=R.RMAX+22,xl=R.CX+rl*Math.sin(a),yl=R.CY-rl*Math.cos(a);
    var yoff=yl<R.CY?-2:12,anchor=Math.abs(xl-R.CX)<6?"middle":(xl>R.CX?"start":"end");
    svg.appendChild(R.el("text",{x:xl.toFixed(1),y:(yl+yoff).toFixed(1),
      "class":"axlab "+(polOf(k)==="lim"?"limit":"enc"),"text-anchor":anchor,"fill-opacity":ST[k].foc}, labelOf(k)));});
  (halos||[]).forEach(function(k){if(ST[k]&&ST[k].op>0.35){var p=R.vert(ST[k].deg,Math.max(R.FLOOR,ST[k].val));
    svg.appendChild(R.el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:11,"class":"fresh-halo"}));}});
}

function setCap(html,tone){capEl.innerHTML=html; capEl.className="cap"+(tone?" tone-"+tone:"");}

function tweenTo(targets,foc,halos,dur,done){
  var from={}; Object.keys(ST).forEach(function(k){from[k]={deg:ST[k].deg,val:ST[k].val,op:ST[k].op,foc:ST[k].foc};});
  var t0=Date.now();
  (function frame(){
    if(rafKilled)return;
    var p=Math.min(1,(Date.now()-t0)/dur), e=ease(p);
    Object.keys(ST).forEach(function(k){var f=from[k],tg=targets[k]||{};
      ST[k].deg=f.deg+((tg.deg!=null?tg.deg:f.deg)-f.deg)*e;
      ST[k].val=f.val+((tg.val!=null?tg.val:f.val)-f.val)*e;
      ST[k].op =f.op +((tg.op !=null?tg.op :f.op )-f.op )*e;
      var tf=(foc==null)?1:(foc.indexOf(k)>=0?1:0.18);
      ST[k].foc=f.foc+(tf-f.foc)*e;});
    place(halos);
    if(p<1){timer=setTimeout(frame,STEP);} else if(done){done();}
  })();
}

function runBeat(i){
  beatIx=i;
  if(i>=BEATS.length){finishMorph();return;}
  var b=BEATS[i];
  if(b.relabel){for(var k in b.relabel)LABELS[k]=b.relabel[k];}
  // build absolute targets from current + beat deltas
  var targets={}; Object.keys(ST).forEach(function(k){targets[k]={};});
  for(var ax in b.set){ if(ST[ax]===undefined) continue; targets[ax]=b.set[ax]; }
  setCap(b.cap,b.tone);
  tweenTo(targets, b.focus||null, b.halo||[], RM?1:TW, function(){
    if(b.settle){finishMorph();return;}
    timer=setTimeout(function(){runBeat(i+1);}, RM?0:(b.hold||HOLD));
  });
}

function finishMorph(){
  // settle: full opacity, focus restored, no halos, caption cleared, controls stay
  rafKilled=false;
  Object.keys(ST).forEach(function(k){ST[k].foc=1;
    if(ENDVAL[k]!=null){ST[k].val=ENDVAL[k];ST[k].op=1;} if(k==="wholegrain"||k==="sugary"){ST[k].op=0;} });
  place([]); setCap("Your <b>diet signature</b> — encourage axes up, limit axes down.","");
  ctrls.classList.add("show");
}

function startMorph(){
  if(timer)clearTimeout(timer); rafKilled=true; setTimeout(function(){rafKilled=false;},0);
  LABELS={}; initState(); ctrls.classList.add("show");
  if(RM){ runBeat(BEATS.length-1); return; }
  place([]); setCap(BEATS[0].cap,BEATS[0].tone);
  timer=setTimeout(function(){runBeat(1);}, 900);
}
function jumpEnd(){ if(timer)clearTimeout(timer); rafKilled=true; setTimeout(function(){rafKilled=false;},0);
  LABELS={sugary:"addsugar"}; initState(); finishMorph(); }

/* ================= view state / drill navigation ============================ */
var crumb,title,sub;
function showWellbeing(){
  if(timer)clearTimeout(timer); rafKilled=true; ctrls.classList.remove("show"); setCap("","");
  crumb.innerHTML='<b>Well-being</b>';
  title.textContent="Well-being";
  sub.innerHTML='six life domains &middot; click the gold <b style="color:var(--gold)">Diet</b> spoke to drill into the diet signature';
  setTimeout(function(){rafKilled=false; drawWellbeing(svg, showDiet);},0);
}
function showDiet(){
  crumb.innerHTML='';
  var back=document.createElement("button"); back.textContent="‹ Well-being"; back.addEventListener("click",showWellbeing);
  crumb.appendChild(back);
  var sep=document.createElement("span"); sep.className="sep"; sep.textContent="›"; crumb.appendChild(sep);
  var here=document.createElement("b"); here.textContent="Diet signature"; crumb.appendChild(here);
  title.textContent="Diet signature";
  sub.innerHTML='the six food groups you sketched, morphing into your <b>expert nutrient signature</b>';
  startMorph();
}

document.addEventListener("DOMContentLoaded",function(){
  svg=document.getElementById("radar"); capEl=document.getElementById("cap");
  ctrls=document.getElementById("ctrls"); crumb=document.getElementById("crumb");
  title=document.getElementById("title"); sub=document.getElementById("sub");
  document.getElementById("skip").addEventListener("click",jumpEnd);
  document.getElementById("replay").addEventListener("click",startMorph);
  showWellbeing();
});
</script>
</html>
