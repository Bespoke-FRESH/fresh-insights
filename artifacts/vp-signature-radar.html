<!doctype html>
<meta charset="utf-8">
<title>signature-radar — minimal reproducible example</title>
<!--
  signature-radar primitive — standalone, zero-dependency reproducible example.
  Extracted from fresh_diet: R/server/radar.R::render_radar_svg (SSR truth) +
  inst/app/www/onb_radar.js (pixel-parity JS draw core) + fresh_diet.css (.radar/*).
  Tokens are the canonical FRESH set (brand.yml -> theme.R::theme_css_root).

  THE CORE IDEA (parameterized): a normalized multi-axis radial plot whose axes
  carry a POLARITY. "encourage" axes cluster the TOP half, "limit" axes the
  BOTTOM half (the polarity-split), and the trace is a CLOSED CATMULL-ROM SPLINE
  (not a straight polygon) so the signature reads as an organic envelope.
  Change `AXES` + `values` and it redraws for any domain. Here: a diet signature.
-->
<style>
  :root{
    --ink:#1a3a2a; --ink-soft:#2a5a3a; --muted-soft:#9aaa9a;
    --paper:#fffdf8; --line:#ddd8cf; --line-soft:#eee8df;
    --accent-soft:#d4eddf; --ok:#2e7d5b; --danger:#a33a2a; --gold:#cb8a35;
    --font-sans:'Source Sans 3','Segoe UI',sans-serif;
    --font-serif:'Lora',Georgia,serif;
  }
  body{background:var(--paper); margin:0; font-family:var(--font-sans); color:var(--ink);}
  .wrap{max-width:640px; margin:0 auto; padding:24px 12px;}
  h1{font-family:var(--font-serif); font-weight:600; font-size:22px; margin:.2em 0;}
  p.sub{color:var(--ink-soft); margin:.2em 0 1em;}
  .radar{width:100%; height:auto; display:block;}
  .radar .ring{fill:none; stroke:var(--line-soft); stroke-width:1; stroke-dasharray:2 3;}
  .radar .ring-1{stroke:var(--line); stroke-dasharray:none;}
  .radar .axis-line{stroke:var(--line); stroke-width:1.25; stroke-linecap:round;}
  .radar .signature{
    fill:var(--accent-soft); fill-opacity:.55;
    stroke:var(--ink); stroke-width:2; stroke-linejoin:round;
  }
  .radar .vertex-sig{fill:var(--ink-soft);}
  .radar text.encourage{fill:var(--ink);   font-family:var(--font-sans); font-size:15px; font-weight:500;}
  .radar text.limit    {fill:var(--danger); font-family:var(--font-sans); font-size:15px; font-weight:600;}
</style>

<div class="wrap">
  <h1>Diet signature</h1>
  <p class="sub">encourage axes rise to the top &middot; limit axes sit at the bottom &middot; closed spline envelope</p>
  <svg class="radar" id="radar" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<script>
/* ---- OnbRadar: the extracted draw core (ported verbatim from onb_radar.js) ---- */
var OnbRadar = (function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var CX = 250, CY = 250, RMAX = 180, FLOOR = 0.03, VIEWBOX = "-70 0 640 500";
  function el(n, a, t){ var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); if(t!=null) e.textContent=t; return e; }
  function rad(d){ return d*Math.PI/180; }
  function vert(deg,v){ var a=rad(deg), r=RMAX*Math.max(0,Math.min(1,v)); return {x:CX+r*Math.sin(a), y:CY-r*Math.cos(a)}; }
  // Catmull-Rom -> cubic Bezier, closed. (spline_path_closed in radar.R)
  function splinePath(pts, tension){
    var n=pts.length; if(n<3) return ""; if(tension==null) tension=0.5;
    function prv(i){return i===0?n-1:i-1;} function nxt(i){return i===n-1?0:i+1;}
    var d="M "+pts[0].x.toFixed(2)+" "+pts[0].y.toFixed(2);
    for(var i=0;i<n;i++){
      var j=nxt(i);
      var c1x=pts[i].x+tension*(pts[j].x-pts[prv(i)].x)/3, c1y=pts[i].y+tension*(pts[j].y-pts[prv(i)].y)/3;
      var c2x=pts[j].x-tension*(pts[nxt(j)].x-pts[i].x)/3, c2y=pts[j].y-tension*(pts[nxt(j)].y-pts[i].y)/3;
      d+=" C "+c1x.toFixed(2)+" "+c1y.toFixed(2)+", "+c2x.toFixed(2)+" "+c2y.toFixed(2)+", "+pts[j].x.toFixed(2)+" "+pts[j].y.toFixed(2);
    }
    return d+" Z";
  }
  function build(svg, axes, order){
    svg.setAttribute("viewBox", VIEWBOX);
    [45,90,135,180].forEach(function(r){ svg.appendChild(el("circle",{cx:CX,cy:CY,r:r,"class":"ring"+(r===180?" ring-1":"")})); });
    var byDeg = order.slice().sort(function(a,b){return axes[a].deg-axes[b].deg;});
    byDeg.forEach(function(key){
      var a=rad(axes[key].deg);
      svg.appendChild(el("line",{ x1:(CX+RMAX*Math.sin(a)).toFixed(1), y1:(CY-RMAX*Math.cos(a)).toFixed(1),
        x2:(CX+(RMAX+14)*Math.sin(a)).toFixed(1), y2:(CY-(RMAX+14)*Math.cos(a)).toFixed(1), "class":"axis-line" }));
    });
    var poly=el("path",{"class":"signature",d:"",style:"display:none"}); svg.appendChild(poly);
    var vtxLayer=el("g",{}); svg.appendChild(vtxLayer);
    byDeg.forEach(function(key){
      var ax=axes[key], a=rad(ax.deg), rl=RMAX+22, xl=CX+rl*Math.sin(a), yl=CY-rl*Math.cos(a);
      var yoff=yl<CY?-2:12, anchor=Math.abs(xl-CX)<6?"middle":(xl>CX?"start":"end");
      svg.appendChild(el("text",{x:xl.toFixed(1),y:(yl+yoff).toFixed(1),
        "class":ax.pol==="limit"?"limit":"encourage","text-anchor":anchor}, (ax.emoji?ax.emoji+" ":"")+ax.label));
    });
    return {poly:poly, vtxLayer:vtxLayer, byDeg:byDeg};
  }
  function polyPoints(order, axes, valueFn){
    var byDeg=order.slice().sort(function(a,b){return axes[a].deg-axes[b].deg;}), pts=[];
    for(var i=0;i<byDeg.length;i++){ var v=valueFn(byDeg[i]); if(v!=null) pts.push(vert(axes[byDeg[i]].deg, Math.max(FLOOR,v))); }
    return pts;
  }
  function setPolygon(poly, pts){ if(pts.length>=3){ poly.setAttribute("d", splinePath(pts,0.5)); poly.style.display=""; } else poly.style.display="none"; }
  function drawVertices(g, order, axes, valueFn){
    order.forEach(function(k){ var v=valueFn(k); if(v==null) return; var p=vert(axes[k].deg, Math.max(FLOOR,v));
      g.appendChild(el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:3.5,"class":"vertex-sig"})); });
  }
  return {CX:CX,CY:CY,RMAX:RMAX, build:build, polyPoints:polyPoints, setPolygon:setPolygon, drawVertices:drawVertices};
})();

/* ---- Polarity-split placement: encourage -> top arc, limit -> bottom arc ---- *
 * Mirrors build_signature_axes_poc()'s encourage-top / limit-bottom split.     */
function placeByPolarity(defs){
  var enc = defs.filter(function(d){return d.pol!=="limit";});
  var lim = defs.filter(function(d){return d.pol==="limit";});
  function spread(list, from, to){
    var n=list.length, axes={};
    list.forEach(function(d,i){ axes[d.key]={label:d.label, emoji:d.emoji||"", pol:d.pol, deg: n===1?(from+to)/2 : from + (to-from)*i/(n-1)}; });
    return axes;
  }
  // top arc: -70..+70 deg ; bottom arc: 110..250 deg (0deg = up)
  return Object.assign({}, spread(enc,-70,70), spread(lim,110,250));
}

/* ---- Demo data: a diet signature (values in 0..1) ---- */
var DEFS = [
  {key:"protein",    label:"Protein",       pol:"encourage"},
  {key:"fiber",      label:"Fiber",         pol:"encourage"},
  {key:"fruits",     label:"Fruits",        pol:"encourage", emoji:"🍎"},
  {key:"vegetables", label:"Vegetables",    pol:"encourage", emoji:"🥬"},
  {key:"wholegrain", label:"Whole grains",  pol:"encourage", emoji:"🌾"},
  {key:"satfat",     label:"Saturated fat", pol:"limit"},
  {key:"sodium",     label:"Sodium",        pol:"limit", emoji:"🧂"},
  {key:"sugary",     label:"Sugary drinks", pol:"limit", emoji:"🥤"}
];
var VALUES = {protein:.72, fiber:.61, fruits:.55, vegetables:.80, wholegrain:.48, satfat:.35, sodium:.58, sugary:.22};

var axes = placeByPolarity(DEFS);
var order = DEFS.map(function(d){return d.key;});
var svg = document.getElementById("radar");
var layers = OnbRadar.build(svg, axes, order);
var valueFn = function(k){ return VALUES[k]==null?null:VALUES[k]; };
OnbRadar.setPolygon(layers.poly, OnbRadar.polyPoints(order, axes, valueFn));
OnbRadar.drawVertices(layers.vtxLayer, order, axes, valueFn);
</script>
