<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>FRESH-Day — relive a day, food by food</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  FRESH-Day: pick a day from the week strip and it opens to that day's full diet
  signature, then RELIVES it food by food — encourage axes grow as good foods land
  (green), limit axes retract as costly foods add sugar/sodium/sat-fat (red),
  honoring axis polarity (an empty plate starts clean/full on the limit axes).
  Self-contained; draw core ported from fresh_diet onb_radar.js / freshday_dayzoom.js.
-->
<style>
  :root{--ink:#1a3a2a;--ink-soft:#2a5a3a;--muted:#9aaa9a;--paper:#fffdf8;--line:#ddd8cf;--line-soft:#eee8df;
    --accent-soft:#d4eddf;--ok:#2e7d5b;--danger:#a33a2a;--gold:#cb8a35;
    --font-sans:'Source Sans 3','Segoe UI',sans-serif;--font-serif:'Lora',Georgia,serif;}
  *{box-sizing:border-box;}
  body{background:var(--paper);margin:0;font-family:var(--font-sans);color:var(--ink);}
  .wrap{max-width:660px;margin:0 auto;padding:18px 12px 26px;}
  .crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-soft);min-height:26px;}
  .crumb button{font:inherit;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:6px;}
  .crumb button:hover{background:var(--line-soft);} .crumb .sep{color:var(--muted);} .crumb b{color:var(--ink);}
  h1{font-family:var(--font-serif);font-weight:600;font-size:21px;margin:.1em 0;}
  h1 .score{color:var(--ok);}
  p.sub{color:var(--ink-soft);margin:.15em 0 .5em;font-size:14px;}
  /* week strip */
  .week{display:flex;gap:6px;margin:6px 0 4px;}
  .day{flex:1 1 0;border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;background:#fff;}
  .day:hover{border-color:var(--ink-soft);} .day .dn{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .day .ds{font-family:var(--font-serif);font-size:18px;font-weight:600;color:var(--ink);}
  .day.sel{background:var(--ink);border-color:var(--ink);} .day.sel .dn,.day.sel .ds{color:var(--paper);}
  /* radar */
  .radar{width:100%;height:auto;display:block;}
  .radar .ring{fill:none;stroke:var(--line-soft);stroke-width:1;stroke-dasharray:2 3;}
  .radar .ring-1{stroke:var(--line);stroke-dasharray:none;}
  .radar .axis-line{stroke:var(--line);stroke-width:1.25;stroke-linecap:round;}
  .radar .signature{fill:var(--accent-soft);fill-opacity:.55;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;}
  .radar .vertex-sig{fill:var(--ink-soft);}
  .radar text.axlab{font-size:13px;font-weight:500;} .radar text.axlab.limit{fill:var(--danger);font-weight:600;} .radar text.axlab.enc{fill:var(--ink);}
  @keyframes haloPulse{0%,100%{transform:scale(.7);opacity:.85}50%{transform:scale(1.5);opacity:.12}}
  .radar .halo{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:haloPulse 1.2s infinite;}
  .radar .halo.up{stroke:var(--ok);} .radar .halo.cost{stroke:var(--danger);}
  .cap{min-height:40px;font-family:var(--font-serif);font-size:15.5px;line-height:1.4;color:var(--ink-soft);margin:4px 4px 0;text-align:center;}
  .cap b{color:var(--ink);font-weight:600;} .cap .cost{color:var(--danger);}
  /* food strip */
  .foods{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
  .food{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 8px;font-size:12.5px;color:var(--muted);opacity:.45;transition:opacity .3s,color .3s,border-color .3s;}
  .food .fe{font-size:15px;} .food.on{opacity:1;color:var(--ink);border-color:var(--ink-soft);}
  .ctrls{display:flex;gap:6px;justify-content:center;margin-top:10px;opacity:0;transition:opacity .3s;} .ctrls.show{opacity:1;}
  .ctrls button{font:inherit;font-size:12.5px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 12px;cursor:pointer;}
  .ctrls button:hover{background:var(--line-soft);}
  @media (prefers-reduced-motion: reduce){.radar .halo{animation:none;}}
</style>

<div class="wrap">
  <div class="crumb" id="crumb"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div id="stage"></div>
</div>

<script>
/* ===== radial core ===== */
var R=(function(){var NS="http://www.w3.org/2000/svg",CX=250,CY=250,RMAX=180,FLOOR=0.03,VB="-70 0 640 500";
  function el(n,a,t){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e;}
  function rad(d){return d*Math.PI/180;}
  function vert(deg,v){var a=rad(deg),r=RMAX*Math.max(0,Math.min(1,v));return{x:CX+r*Math.sin(a),y:CY-r*Math.cos(a)};}
  function spline(pts,t){var n=pts.length;if(n<3)return"";if(t==null)t=.5;function prv(i){return i===0?n-1:i-1;}function nxt(i){return i===n-1?0:i+1;}
    var d="M "+pts[0].x.toFixed(2)+" "+pts[0].y.toFixed(2);
    for(var i=0;i<n;i++){var j=nxt(i);var c1x=pts[i].x+t*(pts[j].x-pts[prv(i)].x)/3,c1y=pts[i].y+t*(pts[j].y-pts[prv(i)].y)/3;
      var c2x=pts[j].x-t*(pts[nxt(j)].x-pts[i].x)/3,c2y=pts[j].y-t*(pts[nxt(j)].y-pts[i].y)/3;
      d+=" C "+c1x.toFixed(2)+" "+c1y.toFixed(2)+", "+c2x.toFixed(2)+" "+c2y.toFixed(2)+", "+pts[j].x.toFixed(2)+" "+pts[j].y.toFixed(2);}return d+" Z";}
  function rings(svg){svg.setAttribute("viewBox",VB);[45,90,135,180].forEach(function(r){svg.appendChild(el("circle",{cx:CX,cy:CY,r:r,"class":"ring"+(r===180?" ring-1":"")}));});}
  function ticks(svg,degs){degs.forEach(function(dg){var a=rad(dg);svg.appendChild(el("line",{x1:(CX+RMAX*Math.sin(a)).toFixed(1),y1:(CY-RMAX*Math.cos(a)).toFixed(1),x2:(CX+(RMAX+14)*Math.sin(a)).toFixed(1),y2:(CY-(RMAX+14)*Math.cos(a)).toFixed(1),"class":"axis-line"}));});}
  return{el:el,rad:rad,vert:vert,spline:spline,rings:rings,ticks:ticks,CX:CX,CY:CY,RMAX:RMAX,FLOOR:FLOOR};})();
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}

/* ===== the day's signature axes + foods ===== */
var DEFS=[{k:"protein",label:"Protein",pol:"enc"},{k:"fiber",label:"Fibre",pol:"enc"},{k:"fruits",label:"Fruits",pol:"enc",e:"🍎"},{k:"vegetables",label:"Vegetables",pol:"enc",e:"🥬"},{k:"wholegrain",label:"Whole grains",pol:"enc",e:"🌾"},{k:"satfat",label:"Saturated fat",pol:"lim"},{k:"sodium",label:"Sodium",pol:"lim",e:"🧂"},{k:"sugary",label:"Added sugars",pol:"lim",e:"🥤"}];
var DEG={};(function(){var enc=DEFS.filter(function(d){return d.pol!=="lim";}),lim=DEFS.filter(function(d){return d.pol==="lim";});
  function sp(l,f,t){var n=l.length;l.forEach(function(d,i){DEG[d.k]=n===1?(f+t)/2:f+(t-f)*i/(n-1);});}sp(enc,-70,70);sp(lim,110,250);})();
// each food: enc = axes it raises; cost = limit axes it pulls down.
var FOODS=[
 {e:"🥣",label:"Oatmeal & berries",note:"fibre, whole grains, fruit",enc:{fiber:.40,wholegrain:.35,fruits:.30}},
 {e:"🍗",label:"Chicken salad",note:"protein & veg",enc:{protein:.45,vegetables:.40},cost:{satfat:.10}},
 {e:"🧀",label:"Cheese & crackers",note:"the salty snack",cost:{satfat:.25,sodium:.20}},
 {e:"🐟",label:"Salmon, quinoa, broccoli",note:"a strong dinner",enc:{protein:.30,vegetables:.35,wholegrain:.20,fiber:.15}},
 {e:"🥤",label:"Soda",note:"the sugar hit",cost:{sugary:.45,sodium:.10}}
];
var DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"], DAYSCORE=[58,62,71,49,66,74,55];
function emptyState(){var s={};DEFS.forEach(function(d){s[d.k]=(d.pol==="lim")?1:0;});return s;} // limit axes start clean/full
function fullState(){var s=emptyState();FOODS.forEach(function(f){apply(s,f);});return s;}
function apply(s,f){if(f.enc)for(var k in f.enc)s[k]=Math.min(1,s[k]+f.enc[k]);if(f.cost)for(var k2 in f.cost)s[k2]=Math.max(0,s[k2]-f.cost[k2]);}
function score(s){var t=0;DEFS.forEach(function(d){t+=s[d.k];});return Math.round(100*t/DEFS.length);}

/* ===== render + relive ===== */
var svg,capEl,ctrls,foodEls,VAL={},timer=null,killed=false;
var STEP=40,TW=560,HOLD=1500; var RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function ease(p){return p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;}
var order=DEFS.map(function(d){return d.k;}).sort(function(a,b){return DEG[a]-DEG[b];});
function draw(halos){clear(svg);R.rings(svg);R.ticks(svg,order.map(function(k){return DEG[k];}));
  var pts=order.map(function(k){return R.vert(DEG[k],Math.max(R.FLOOR,VAL[k]));});
  svg.appendChild(R.el("path",{"class":"signature",d:R.spline(pts,.5)}));
  order.forEach(function(k){var p=R.vert(DEG[k],Math.max(R.FLOOR,VAL[k]));svg.appendChild(R.el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:3.5,"class":"vertex-sig"}));});
  DEFS.forEach(function(d){var a=R.rad(DEG[d.k]),rl=R.RMAX+22,xl=R.CX+rl*Math.sin(a),yl=R.CY-rl*Math.cos(a),yo=yl<R.CY?-2:12,an=Math.abs(xl-R.CX)<6?"middle":(xl>R.CX?"start":"end");
    svg.appendChild(R.el("text",{x:xl.toFixed(1),y:(yl+yo).toFixed(1),"class":"axlab "+(d.pol==="lim"?"limit":"enc"),"text-anchor":an},(d.e?d.e+" ":"")+d.label));});
  (halos||[]).forEach(function(h){var p=R.vert(DEG[h.k],Math.max(R.FLOOR,VAL[h.k]));svg.appendChild(R.el("circle",{cx:p.x.toFixed(2),cy:p.y.toFixed(2),r:11,"class":"halo "+h.type}));});}
function setCap(h){capEl.innerHTML=h;}
function tween(to,halos,dur,done){var from={};order.forEach(function(k){from[k]=VAL[k];});var t0=Date.now();
  (function frame(){if(killed)return;var p=Math.min(1,(Date.now()-t0)/dur),e=ease(p);
    order.forEach(function(k){VAL[k]=from[k]+((to[k]!=null?to[k]:from[k])-from[k])*e;});draw(halos);
    if(p<1)timer=setTimeout(frame,STEP);else{order.forEach(function(k){VAL[k]=(to[k]!=null?to[k]:VAL[k]);});draw(halos);if(done)done();}})();}

function relive(dayIx){
  if(timer)clearTimeout(timer);killed=true;
  setTimeout(function(){killed=false;
    var full=fullState(); VAL=fullState(); FOODS.forEach(function(_,i){foodEls[i].classList.remove("on");});
    ctrls.classList.add("show");
    if(RM){VAL=full;FOODS.forEach(function(_,i){foodEls[i].classList.add("on");});draw([]);setCap("<b>"+DAYS[dayIx]+"</b> — your day, as eaten.");return;}
    // Beat 0: show the FULL day first.
    draw([]); setCap("<b>"+DAYS[dayIx]+"</b> — your whole day, <b>"+score(full)+"</b>/100.");
    timer=setTimeout(function(){
      // reset to empty, then walk foods
      setCap("Now relive it — <b>food by food</b>.");
      tween(emptyState(),[],TW,function(){
        var acc=emptyState(); VAL=emptyState(); var i=0;
        (function next(){
          if(i>=FOODS.length){ // settle back at full
            setCap("<b>"+DAYS[dayIx]+"</b> — the whole day, <b>"+score(full)+"</b>/100."); tween(full,[],TW); return; }
          var f=FOODS[i], before={}; order.forEach(function(k){before[k]=acc[k];}); apply(acc,f);
          var halos=[]; if(f.enc)for(var k in f.enc)halos.push({k:k,type:"up"}); if(f.cost)for(var k2 in f.cost)halos.push({k:k2,type:"cost"});
          foodEls[i].classList.add("on");
          setCap(f.e+" <b>"+f.label+"</b> — "+(f.cost&&!f.enc?"<span class='cost'>"+f.note+"</span>":f.note)+".");
          var target={}; order.forEach(function(k){target[k]=acc[k];});
          tween(target,halos,TW,function(){i++;timer=setTimeout(next,RM?0:HOLD);});
        })();
      });
    }, RM?0:1900);
  },0);
}

/* ===== views ===== */
var stage,crumb,title,sub;
function showWeek(){
  if(timer)clearTimeout(timer);killed=true;
  crumb.innerHTML='<b>This week</b>';
  title.textContent="Your week";
  sub.innerHTML='seven FRESH-Days · tap a day to relive it food by food';
  clear(stage);
  var wk=document.createElement("div");wk.className="week";
  DAYS.forEach(function(dn,i){var b=document.createElement("div");b.className="day"+(i===1?" sel":"");
    b.innerHTML='<div class="dn">'+dn+'</div><div class="ds">'+DAYSCORE[i]+'</div>';
    b.addEventListener("click",function(){showDay(i);}); wk.appendChild(b);});
  stage.appendChild(wk);
  var hint=document.createElement("p");hint.className="sub";hint.style.textAlign="center";hint.style.marginTop="14px";
  hint.innerHTML='↑ tap <b>Tue</b> (or any day)';stage.appendChild(hint);
}
function showDay(i){
  crumb.innerHTML='';
  var back=document.createElement("button");back.textContent="‹ This week";back.addEventListener("click",showWeek);crumb.appendChild(back);
  var sep=document.createElement("span");sep.className="sep";sep.textContent="›";crumb.appendChild(sep);
  var here=document.createElement("b");here.textContent=DAYS[i]+"’s day";crumb.appendChild(here);
  title.innerHTML=DAYS[i]+" · <span class='score'>"+DAYSCORE[i]+"</span>/100";
  sub.innerHTML='your full diet signature for the day — then relived food by food';
  // build stage: radar + caption + food strip + controls
  clear(stage);
  svg=R.el("svg",{"class":"radar",id:"radar"});svg.setAttribute("xmlns","http://www.w3.org/2000/svg");stage.appendChild(svg);
  capEl=document.createElement("p");capEl.className="cap";capEl.id="cap";stage.appendChild(capEl);
  var fs=document.createElement("div");fs.className="foods";foodEls=[];
  FOODS.forEach(function(f){var c=document.createElement("div");c.className="food";c.innerHTML='<span class="fe">'+f.e+'</span>'+f.label;fs.appendChild(c);foodEls.push(c);});
  stage.appendChild(fs);
  ctrls=document.createElement("div");ctrls.className="ctrls";
  var skip=document.createElement("button");skip.textContent="Skip ↦";skip.addEventListener("click",function(){jumpEnd(i);});
  var rep=document.createElement("button");rep.textContent="↻ Replay";rep.addEventListener("click",function(){relive(i);});
  ctrls.appendChild(skip);ctrls.appendChild(rep);stage.appendChild(ctrls);
  relive(i);
}
function jumpEnd(i){if(timer)clearTimeout(timer);killed=true;setTimeout(function(){killed=false;VAL=fullState();
  FOODS.forEach(function(_,k){foodEls[k].classList.add("on");});draw([]);setCap("<b>"+DAYS[i]+"</b> — the whole day, <b>"+score(fullState())+"</b>/100.");ctrls.classList.add("show");},0);}

document.addEventListener("DOMContentLoaded",function(){
  stage=document.getElementById("stage");crumb=document.getElementById("crumb");title=document.getElementById("title");sub=document.getElementById("sub");
  showWeek();
});
</script>

<script>

  if(window.self!==window.top)return;

    w.style.cssText="margin:26px auto 12px;max-width:min(560px,calc(100% - 28px));padding:16px 18px 18px;text-align:center;background:#f6f3ee;border:1px solid #eee8df;border-radius:12px;font-family:'Source Sans 3','Segoe UI',sans-serif";
    var mail="mailto:"+["bespoke.analytics.llc","gmail.com"].join("@")+"?subject="+encodeURIComponent("Feedback: "+document.title);
    w.innerHTML='<div style="font-family:Lora,Georgia,serif;font-size:1.15rem;color:#1a3a2a;margin-bottom:2px">Get new essays by email<\/div>'
      +'<div style="font-size:.9rem;color:#586858;margin-bottom:10px">One a week, from the FRESH pipeline. Free.<\/div>'
      +'<a href="https://joshmarino.substack.com/subscribe" target="_blank" rel="noopener" style="display:inline-block;background:#1a3a2a;color:#fffdf8;text-decoration:none;font-weight:600;font-size:.95rem;padding:8px 22px;border-radius:999px">Subscribe<\/a>'
      +'<div style="font-size:.86rem;color:#586858;margin-top:10px">Thoughts? <a href="https://joshmarino.substack.com" target="_blank" rel="noopener" style="color:#2a5a3a;font-weight:600">Comment on Substack<\/a> &middot; <a href="'+mail+'" style="color:#2a5a3a;font-weight:600">Email feedback<\/a><\/div>';
    (document.body||document.documentElement).appendChild(w);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",add);else add();
})();
</script>
</html>
