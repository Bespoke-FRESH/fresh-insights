<!doctype html>
<meta charset="utf-8">
<title>day-zoom-relive-climb — the actual relive→climb animation, standalone</title>
<!--
  day-zoom-relive-climb — THE ACTUAL fresh_diet animation, running standalone.
  `freshday_dayzoom.js` here is the production file COPIED VERBATIM
  (fresh_diet/inst/app/www/freshday_dayzoom.js). It AUTO-INITS on DOMContentLoaded
  (no jQuery needed) from the JSON on .fdz[data-fdz]. This page supplies that
  synthetic-but-real-shaped payload + the scoreboard DOM the file drives.
  Movements: an intro (one idea per beat), then RELIVE (empty plate → food by
  food), then CLIMB (each swap lands, polygon tweens, score ticks up).
-->
<style>
/* inlined: ../theme-fresh/tokens.css */

   This is the ONE token file the visual-primitive library imports; the catalogue

  --accent-primary: #3a7a5a;

<style>
  :root{ --accent:#2e7d5b; --accent-primary:#3a7a5a; }
  body{background:var(--paper); margin:0; font-family:var(--font-sans); color:var(--ink);}
  .wrap{max-width:560px; margin:0 auto; padding:20px 14px;}
  h1{font-family:var(--font-serif); font-weight:600; font-size:20px; margin:.1em 0;}
  p.sub{color:var(--ink-soft); font-size:13px; margin:.2em 0 1em;}
  /* scoreboard (mirrors .fdz .sb-* in fresh_diet.css) */
  .fdz .plan-scoreboard{display:grid; grid-template-columns:1fr auto; align-items:center; gap:0 var(--sp-md); min-height:3.6rem;}
  .fdz .sb-eyebrow{grid-column:1; font-family:var(--font-sans); text-transform:uppercase; letter-spacing:.1em; font-size:.66rem; color:var(--ink-soft);}
  .fdz .sb-food{grid-column:1; font-family:var(--font-serif); font-size:1.45rem; font-weight:600; color:var(--ink); line-height:1.15; min-height:1.15em;}
  .fdz .sb-food .sb-to{color:var(--accent-primary);}
  .fdz .sb-food.tone-green{color:var(--ok);} .fdz .sb-food.tone-red{color:var(--danger);}
  .fdz .sb-scorewrap{grid-column:2; grid-row:1 / span 2; display:flex; flex-direction:column; align-items:flex-end; justify-content:center;}
  .fdz .sb-score{font-family:var(--font-mono); font-weight:700; font-size:2.5rem; line-height:1; color:var(--ink); font-variant-numeric:tabular-nums;}
  .fdz .sb-delta{font-family:var(--font-sans); font-size:.8rem; color:var(--ink-soft); min-height:1em;} .fdz .sb-delta.up{color:var(--ok);}
  /* radar */
  .fdz svg.radar{width:100%; max-width:520px; margin:0 auto; display:block; font-family:var(--font-sans);}
  .fdz svg.radar .vertex-sig{display:none;}
  .radar .ring{fill:none; stroke:var(--line-soft); stroke-width:1; stroke-dasharray:2 3;}
  .radar .ring-1{stroke:var(--line); stroke-dasharray:none;}
  .radar .axis-line{stroke:var(--line); stroke-width:1.25;}
  .radar text.encourage{fill:var(--ink); font-size:13px; font-weight:500;}
  .radar text.limit{fill:var(--danger); font-size:13px; font-weight:600;}

  .fdz path.r-ghost{fill:none; stroke:var(--ink-soft); stroke-width:1.5; stroke-dasharray:4 4; opacity:.5;}

  .fdz g.fdz-halo-layer .halo.is-down{stroke:var(--danger); fill:var(--danger-wash-light);}
  @keyframes fdzpulse{0%,100%{opacity:.5;} 50%{opacity:1;}}

<div class="wrap">
  <h1>FRESH Day — relive &amp; climb</h1>
  <p class="sub">the actual <code>freshday_dayzoom.js</code>: your plate assembles food-by-food, then each smart swap lands and the score climbs</p>

  <div class="fdz" data-fdz="{}">
    <div class="plan-scoreboard">
      <div class="sb-eyebrow" id="fdzEyebrow">Reading your signature</div>
      <div class="sb-food" id="fdzFood">…</div>

<script>
/* ---- build the radar scaffold + the synthetic-but-real-shaped fdz payload ---- */
(function(){
  var NS="http://www.w3.org/2000/svg", CX=250, CY=250, RMAX=180, FLOOR=0.03, VIEWBOX="-70 0 640 500";
  function el(n,a,t){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e;}
  function rad(d){return d*Math.PI/180;}
  function vert(deg,v){var a=rad(deg),r=RMAX*Math.max(0,Math.min(1,v));return {x:CX+r*Math.sin(a),y:CY-r*Math.cos(a)};}
  function splinePath(pts,t){var n=pts.length;if(n<3)return"";if(t==null)t=0.5;
    function prv(i){return i===0?n-1:i-1;}function nxt(i){return i===n-1?0:i+1;}
    var d="M "+pts[0].x.toFixed(2)+" "+pts[0].y.toFixed(2);
    for(var i=0;i<n;i++){var j=nxt(i);
      var c1x=pts[i].x+t*(pts[j].x-pts[prv(i)].x)/3,c1y=pts[i].y+t*(pts[j].y-pts[prv(i)].y)/3;
      var c2x=pts[j].x-t*(pts[nxt(j)].x-pts[i].x)/3,c2y=pts[j].y-t*(pts[nxt(j)].y-pts[i].y)/3;
      d+=" C "+c1x.toFixed(2)+" "+c1y.toFixed(2)+", "+c2x.toFixed(2)+" "+c2y.toFixed(2)+", "+pts[j].x.toFixed(2)+" "+pts[j].y.toFixed(2);}
    return d+" Z";}
  var DEFS=[{key:"protein",label:"Protein",pol:"encourage"},{key:"fiber",label:"Fiber",pol:"encourage"},{key:"fruits",label:"Fruits",pol:"encourage",emoji:"🍎"},{key:"vegetables",label:"Vegetables",pol:"encourage",emoji:"🥬"},{key:"wholegrain",label:"Whole grains",pol:"encourage",emoji:"🌾"},{key:"satfat",label:"Saturated fat",pol:"limit"},{key:"sodium",label:"Sodium",pol:"limit",emoji:"🧂"},{key:"sugary",label:"Sugary drinks",pol:"limit",emoji:"🥤"}];
  var axes={}; (function(){var enc=DEFS.filter(function(d){return d.pol!=="limit";}),lim=DEFS.filter(function(d){return d.pol==="limit";});
    function spread(list,from,to){var n=list.length;list.forEach(function(d,i){axes[d.key]={label:d.label,emoji:d.emoji||"",pol:d.pol,deg:n===1?(from+to)/2:from+(to-from)*i/(n-1)};});}
    spread(enc,-70,70); spread(lim,110,250);})();
  var order=DEFS.map(function(d){return d.key;}), byDeg=order.slice().sort(function(a,b){return axes[a].deg-axes[b].deg;});
  var svg=document.getElementById("fdz-svg"); svg.setAttribute("viewBox",VIEWBOX);
  [45,90,135,180].forEach(function(r){svg.appendChild(el("circle",{cx:CX,cy:CY,r:r,"class":"ring"+(r===180?" ring-1":"")}));});
  byDeg.forEach(function(k){var a=rad(axes[k].deg);svg.appendChild(el("line",{x1:(CX+RMAX*Math.sin(a)).toFixed(1),y1:(CY-RMAX*Math.cos(a)).toFixed(1),x2:(CX+(RMAX+14)*Math.sin(a)).toFixed(1),y2:(CY-(RMAX+14)*Math.cos(a)).toFixed(1),"class":"axis-line"}));});
  svg.appendChild(el("path",{"class":"signature",d:""}));
  byDeg.forEach(function(k){var ax=axes[k],a=rad(ax.deg),rl=RMAX+22,xl=CX+rl*Math.sin(a),yl=CY-rl*Math.cos(a);
    var yoff=yl<CY?-2:12,anchor=Math.abs(xl-CX)<6?"middle":(xl>CX?"start":"end");
    svg.appendChild(el("text",{x:xl.toFixed(1),y:(yl+yoff).toFixed(1),"class":ax.pol==="limit"?"limit":"encourage","text-anchor":anchor},(ax.emoji?ax.emoji+" ":"")+ax.label));});
  function dOf(v){return splinePath(byDeg.map(function(k){return vert(axes[k].deg,Math.max(FLOOR,v[k]));}),0.5);}
  function vtx(k,v){var p=vert(axes[k].deg,Math.max(FLOOR,v));return {x:+p.x.toFixed(2),y:+p.y.toFixed(2)};}
  function movedFor(prev,next){var out=[];order.forEach(function(k){if(Math.abs((next[k]||0)-(prev[k]||0))>0.001){var dir=axes[k].pol==="limit"?(next[k]<prev[k]?"up":"down"):(next[k]>=prev[k]?"up":"down");var p=vtx(k,next[k]);out.push({x:p.x,y:p.y,dir:dir,mag:+Math.abs(next[k]-prev[k]).toFixed(3),label:axes[k].label});}});return out;}

  // empty plate: encourage at floor, limit FULL (honest polarity — bad starts high)
  var EMPTY={protein:FLOOR,fiber:FLOOR,fruits:FLOOR,vegetables:FLOOR,wholegrain:FLOOR,satfat:1,sodium:1,sugary:1};
  var FULL={protein:1,fiber:1,fruits:1,vegetables:1,wholegrain:1,satfat:FLOOR,sodium:FLOOR,sugary:FLOOR};
  // foods eaten (relive): each nudges the plate toward the as-eaten day
  var EATEN=[
    {name:"White-bread toast", set:{wholegrain:.15, sugary:.85}},
    {name:"Scrambled eggs",    set:{protein:.45, satfat:.7}},
    {name:"Side salad",        set:{vegetables:.5, fiber:.35}},
    {name:"Soda",              set:{sugary:.95}},
    {name:"Deli sandwich",     set:{protein:.55, sodium:.85, fruits:.15}}
  ];
  var buildDs=[dOf(EMPTY)], buildMoved=[], cur=Object.assign({},EMPTY);
  EATEN.forEach(function(f){var prev=Object.assign({},cur);Object.keys(f.set).forEach(function(k){cur[k]=f.set[k];});buildDs.push(dOf(cur));buildMoved.push(movedFor(prev,cur));});
  var asEaten=Object.assign({},cur);
  // swaps (climb): each improves the day
  var SWAPS=[
    {from:"White bread",to:"Whole-grain",set:{wholegrain:.62}, delta:8},
    {from:"Soda",to:"Sparkling water",set:{sugary:.20}, delta:9},
    {from:"Deli meat",to:"Roast chicken",set:{sodium:.45}, delta:7},
    {from:"—",to:"Add berries",set:{fruits:.6, fiber:.55}, delta:6}
  ];
  var framesDs=[dOf(asEaten)], steps=[], scores=[54], sc=54, cs=Object.assign({},asEaten);
  SWAPS.forEach(function(s){var prev=Object.assign({},cs);Object.keys(s.set).forEach(function(k){cs[k]=s.set[k];});framesDs.push(dOf(cs));sc+=s.delta;scores.push(sc);steps.push({from:s.from,to:s.to,meta:"",delta:s.delta,moved:movedFor(prev,cs)});});
  // foods list: swapped foods swap=index; kept foods swap=null
  var eaten=[{name:"White-bread toast",swap:0},{name:"Soda",swap:1},{name:"Deli sandwich",swap:2},{name:"Scrambled eggs",swap:null},{name:"Side salad",swap:null}];
  var limitVerts=["satfat","sodium","sugary"].map(function(k){return vtx(k,1);});

  var payload={buildDs:buildDs, framesDs:framesDs, scores:scores, steps:steps, eaten:eaten, buildMoved:buildMoved, limitVerts:limitVerts, fullD:dOf(FULL)};
  document.querySelector(".fdz[data-fdz]").setAttribute("data-fdz", JSON.stringify(payload));
})();
</script>
<script>
/* inlined: ./freshday_dayzoom.js */
/* freshday_dayzoom.js — FRESH Day day-zoom (L2) relive -> climb animation.
 *
 * Pixel parity with My Plan: the radar chrome (rings, clustered+gapped axes,
 * emoji food-group labels, spline polygon) is SERVER-rendered by
 * render_radar_svg() (R/server/freshday.R). This driver tweens ONLY the
 * path.signature "d" attribute through the frames freshday_dayzoom_data()
 * (R/freshday.R) embeds as JSON on .fdz[data-fdz] — the radar_projection.js
 * pattern, so the day-zoom radar IS the live signature radar:
 *   buildDs   : [d, ...]                 RELIVE: empty plate -> food-by-food
 *   framesDs  : [d, ...]                 CLIMB:  as-eaten -> each greedy swap
 *   buildMoved: [[{x,y,dir}...], ...]    per-food moved-axis halo vertices
 *   scores    : [as-eaten, +swap1, ...]  framework score per climb frame
 *   steps     : [{from,to,meta,delta,moved:[{x,y,dir}...]}]   one per swap
 *   eaten     : [{name, swap}]           foods in eating order (aligned buildDs[1..])
 *
 * Two movements: relive the day (polygon assembles food by food, score held
 * out), hold, then climb (swaps land, score ticks up). Honest polarity is baked
 * into the frames (limit axes start full, retract). Re-inits on re-render.
 */
(function () {
  var SVGNS = "http://www.w3.org/2000/svg";
  // Paced slow so the viewer can appreciate each beat (Josh 2026-06-22):
  //   CLIMB  per swap = LAND (name the swap, hold) -> SEG (polygon + score grow)
  //          -> HOLD (rest before the next). RELIVE per food = RELIVE_MS (grow)
  //          -> RELIVE_GAP (rest); RELIVE_HOLD on the assembled as-eaten day.
  var SEG_MS = 1150, LAND_MS = 620, HOLD_MS = 780,
      RELIVE_MS = 640, RELIVE_GAP = 500, RELIVE_HOLD = 2600;

  // Movement 0 — the guided overview that orients the viewer BEFORE the relive:
  // what the spokes are, why the red ones start full, and what's coming. One
  // idea per beat, paced for reading; the empty-plate radar shows throughout and
  // the red/limit spokes pulse on the beat that explains them.
  var INTRO_MS = 7500;   // slow — these are difficult concepts; let each beat land
  // One idea per beat. The radar holds while each beat lands; beat 1 shows the
  // full "perfect day" circle, then the empty plate; beats 3/4 pop the encourage
  // / limit spokes (colour + size) as the narrator names them (tone-matched).
  var INTRO = [
    { text: "A perfect day fills the whole circle.", full: true },
    { text: "It means getting enough of the green spokes — protein, fiber, fruit, veg, fish, nuts.", hl: "encourage", tone: "green" },
    { text: "…while limiting the red ones, like added sugars and cholesterol.", hl: "limit", tone: "red", haloRed: true },
    { text: "Your day starts fresh: already limiting well, but the greens aren’t filled in yet." }
  ];

  var BUILD, FRAMES, SCORES, STEPS, EATEN, BUILD_MOVED, LIMIT_VERTS, FULL_D, NSTEP;
  var svg, poly, ghost, haloLayer, els = {};
  var runId = 0, cursor = 0, playing = false, introDone = false, timers = [];

  var NUM_RE = /-?\d+(?:\.\d+)?/g;
  function byId(id) { return document.getElementById(id); }
  function elN(n, a) { var e = document.createElementNS(SVGNS, n); for (var k in a) e.setAttribute(k, a[k]); return e; }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function T(fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function announce(m) { if (els.announce) els.announce.textContent = m; }
  function reduced() { return window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches; }
  function clamp(i) { return Math.max(0, Math.min(NSTEP, i)); }
  function totalAt(i) { return SCORES[clamp(i)]; }

  // Lerp the i-th number of d-string `a` toward `b` (identical structure — same
  // sig, same spline_path_closed output shape) and rebuild from `a`.
  function lerpPath(a, b, t) {
    if (!a) return b || ""; if (!b) return a;
    var nb = b.match(NUM_RE) || [], i = 0;
    return a.replace(NUM_RE, function (m) {
      var av = parseFloat(m), bv = i < nb.length ? parseFloat(nb[i]) : av; i++;
      return (av + (bv - av) * t).toFixed(2);
    });
  }
  function setPoly(d) { if (poly) poly.setAttribute("d", d); }
  function clearHalos() { while (haloLayer && haloLayer.firstChild) haloLayer.removeChild(haloLayer.firstChild); }
  function drawHalos(moved) {
    clearHalos();
    (moved || []).forEach(function (m) {
      haloLayer.appendChild(elN("circle", { class: "halo" + (m.dir === "down" ? " is-down" : ""), cx: m.x, cy: m.y, r: 7 }));
    });
  }

  function setScoreboard(i, scoreVal) {
    var total = (scoreVal != null) ? scoreVal : totalAt(i);
    els.score.textContent = Math.round(total);
    if (i <= 0) {
      els.eyebrow.textContent = "As you ate it"; els.food.textContent = "The day you logged";
      els.delta.textContent = "before any swaps"; els.delta.classList.remove("up");
    } else {
      var s = STEPS[i - 1];
      els.eyebrow.textContent = "Swap " + i;   // "of N" lives on the step track
      els.food.innerHTML = s.from + ' &rarr; <span class="sb-to">' + s.to + "</span>";
      els.delta.textContent = "+" + Math.round(total - SCORES[0]) + " from as-eaten"; els.delta.classList.add("up");
    }
  }
  function setPlayGlyph() { var pb = els.root.querySelector(".pt-play"); if (pb) { pb.innerHTML = playing ? "&#9208;" : "&#9654;"; pb.title = playing ? "Pause" : "Replay"; } }
  function updateChrome(i) {
    var dis = function (sel, off) { var b = els.root.querySelector(sel); if (b) b.disabled = off; };
    dis(".pt-prev", i <= 0); dis(".pt-next", i >= NSTEP);
    if (els.steps) Array.prototype.forEach.call(els.steps.children, function (d, k) {
      d.classList.toggle("is-current", k === i);
      d.setAttribute("aria-selected", k === i ? "true" : "false");
    });
    setPlayGlyph();
  }
  function syncFoodRows(i) {
    EATEN.forEach(function (f) { if (f.swap == null) return; var step = f.swap + 1;
      if (f.el) { f.el.classList.toggle("swapped", i >= step); f.el.classList.toggle("is-current", i === step); } });
  }

  function drawSnap(i) {
    i = clamp(i); setPoly(FRAMES[i]);
    if (i >= 1) { ghost.setAttribute("d", FRAMES[i - 1]); ghost.style.display = ""; drawHalos(STEPS[i - 1] && STEPS[i - 1].moved); }
    else { ghost.style.display = "none"; clearHalos(); }
    setScoreboard(i, null); updateChrome(i); syncFoodRows(i);
  }
  function preview(i) { runId++; playing = false; setPlayGlyph(); i = clamp(i);
    setPoly(FRAMES[i]);
    if (i >= 1) { ghost.setAttribute("d", FRAMES[i - 1]); ghost.style.display = ""; drawHalos(STEPS[i - 1] && STEPS[i - 1].moved); } else { ghost.style.display = "none"; clearHalos(); }
    setScoreboard(i, null); syncFoodRows(i); }
  function snapTo(i) { runId++; playing = false; drawSnap(i); setPlayGlyph(); }
  function setCursor(i) { cursor = clamp(i); snapTo(cursor); }

  function tweenSeg(i, myRun, done) {
    if (i >= NSTEP) { if (done) done(); return; }
    ghost.setAttribute("d", FRAMES[i]); ghost.style.display = ""; drawHalos(STEPS[i] && STEPS[i].moved);
    setScoreboard(i + 1, totalAt(i)); updateChrome(i);
    var a = FRAMES[i], b = FRAMES[i + 1], s0 = totalAt(i), s1 = totalAt(i + 1), start = null, fin = false;
    function finish() { if (fin || myRun !== runId) return; fin = true; setPoly(b); setScoreboard(i + 1, s1); cursor = i + 1; syncFoodRows(cursor); if (cursor >= NSTEP) playing = false; updateChrome(cursor);
      announce("Swap " + (i + 1) + " of " + NSTEP + ": " + STEPS[i].from + " to " + STEPS[i].to + ". Now " + s1 + ", up " + (s1 - SCORES[0]) + " from as eaten.");
      if (done) done(); }
    setTimeout(function tick() { if (myRun !== runId || fin) return; if (start === null) start = Date.now();
      var t = (Date.now() - start) / SEG_MS; if (t > 1) t = 1; var e = easeOut(t);
      setPoly(lerpPath(a, b, e)); setScoreboard(i + 1, s0 + (s1 - s0) * e);
      if (t < 1) setTimeout(tick, 33); else finish(); }, LAND_MS);
    setTimeout(finish, LAND_MS + SEG_MS + 400);
  }
  function playFrom(startI, onDone) {
    if (reduced()) { playing = false; cursor = NSTEP; drawSnap(NSTEP); setPlayGlyph(); if (onDone) onDone(); return; }
    var myRun = ++runId; playing = true; cursor = clamp(startI); drawSnap(cursor); setPlayGlyph();
    (function next(j) { if (myRun !== runId || !playing) return;
      if (j >= NSTEP) { playing = false; cursor = NSTEP; setPlayGlyph(); updateChrome(NSTEP); if (onDone) onDone(); return; }
      tweenSeg(j, myRun, function () { if (myRun !== runId) return; if (cursor >= NSTEP) { playing = false; setPlayGlyph(); if (onDone) onDone(); return; } if (!playing) return;
        setTimeout(function () { if (myRun === runId && playing) next(j + 1); }, HOLD_MS); });
    })(cursor);
  }
  function togglePlay() { if (!introDone) return; if (playing) snapTo(cursor); else playFrom(cursor >= NSTEP ? 0 : cursor); }

  // ---------- bind to the server-rendered radar + build the chips ----------
  function bindRadar() {
    var host = byId("fdzRadarHost");
    poly = host && host.querySelector("path.signature");
    if (!poly) return false;
    svg = poly.ownerSVGElement;
    ghost = svg.querySelector("path.r-ghost");
    if (!ghost) { ghost = elN("path", { class: "r-ghost" }); poly.parentNode.insertBefore(ghost, poly); }
    haloLayer = svg.querySelector("g.fdz-halo-layer");
    if (!haloLayer) { haloLayer = elN("g", { class: "fdz-halo-layer" }); svg.appendChild(haloLayer); }
    return true;
  }
  // No swap list — ONE swap shows at a time in the scoreboard, stepped via the
  // transport. Only the unchanged "Kept as-is" foods get chips (at the bottom);
  // swapped foods have no chip (f.el = null), the scoreboard names them.
  function buildChips() {
    if (els.kept) els.kept.innerHTML = "";
    EATEN.forEach(function (f) {
      if (f.swap != null) { f.el = null; return; }
      var sp = document.createElement("span"); sp.className = "kchip"; sp.textContent = f.name;
      if (els.kept) els.kept.appendChild(sp); f.el = sp;
    });
  }
  function resetFoodList() { EATEN.forEach(function (f) { if (f.el) f.el.classList.remove("in", "swapped", "is-current", "ready", "demo"); }); }

  // Single clickable step track: as-eaten (0) + one dot per swap (1..NSTEP). The
  // sole step indicator + jump nav (replaces the "N / M" counter and the
  // scoreboard's "of M"). Click/Enter jumps straight to any step.
  function buildSteps() {
    if (!els.steps) return;
    els.steps.innerHTML = "";
    for (var k = 0; k <= NSTEP; k++) (function (kk) {
      var d = document.createElement("button");
      d.type = "button"; d.className = "fdz-step"; d.setAttribute("data-step", kk);
      d.setAttribute("role", "tab");
      d.setAttribute("aria-label", kk === 0 ? "As you ate it" : ("Swap " + kk + " of " + NSTEP));
      d.addEventListener("click", function () { if (introDone) setCursor(kk); });
      d.addEventListener("keydown", function (e) { if (introDone && (e.key === "Enter" || e.key === " " || e.keyCode === 13 || e.keyCode === 32)) { e.preventDefault(); setCursor(kk); } });
      els.steps.appendChild(d);
    })(k);
  }

  // ---------- movements ----------
  // Movement 0 — orient: hold the empty-plate radar, narrate one idea per beat
  // (what the spokes are, the green/red split, why red starts full, what's
  // coming). Score held out (—); the red/limit spokes pulse on their beat.
  function introClearHL() {
    if (svg) svg.classList.remove("hl-encourage", "hl-limit");
    els.food.classList.remove("tone-green", "tone-red");
  }
  function introOverview(myRun, done) {
    ghost.style.display = "none"; clearHalos();
    els.score.textContent = "—"; els.delta.textContent = ""; els.delta.classList.remove("up");
    els.eyebrow.textContent = "Reading your signature";
    var k = 0;
    (function beat() {
      if (myRun !== runId) return;
      if (k >= INTRO.length) { introClearHL(); clearHalos(); done(); return; }
      var b = INTRO[k];
      setPoly(b.full && FULL_D ? FULL_D : BUILD[0]);
      els.food.textContent = b.text; announce(b.text);
      introClearHL();
      if (b.hl && svg) svg.classList.add("hl-" + b.hl);
      if (b.tone) els.food.classList.add(b.tone === "green" ? "tone-green" : "tone-red");
      if (b.haloRed && LIMIT_VERTS && LIMIT_VERTS.length)
        drawHalos(LIMIT_VERTS.map(function (v) { return { x: v.x, y: v.y, dir: "down" }; }));
      else clearHalos();
      k++; T(beat, INTRO_MS);
    })();
  }

  function relivePhase(myRun, done) {
    els.eyebrow.textContent = "Reliving your day"; els.score.textContent = "—";
    els.delta.textContent = "building your day"; els.delta.classList.remove("up");
    var k = 0;
    (function step() {
      if (myRun !== runId) return;
      if (k >= EATEN.length) { setPoly(FRAMES[0]); clearHalos(); setScoreboard(0, null);
        announce("Your day as you ate it scored " + SCORES[0] + " out of 100."); T(function () { if (myRun === runId) done(); }, RELIVE_HOLD); return; }
      var f = EATEN[k]; if (f.el) f.el.classList.add("in"); els.food.textContent = f.name;
      els.delta.textContent = reliveContribution(BUILD_MOVED[k]);   // what this food did
      drawHalos(BUILD_MOVED[k]);
      var a = BUILD[k], b = BUILD[k + 1], start = null;
      setTimeout(function tick() { if (myRun !== runId) return; if (start === null) start = Date.now();
        var t = (Date.now() - start) / RELIVE_MS; if (t > 1) t = 1; var e = easeOut(t);
        setPoly(lerpPath(a, b, e));
        if (t < 1) setTimeout(tick, 33); else { k++; T(step, RELIVE_GAP); } }, 0);
    })();
  }
  // Name the axis a food moved most, polarity-aware: an encourage axis it grew
  // ("added fiber") or a limit axis it pushed ("high in sodium") — so each food
  // in the relive says what it did to the signature.
  function reliveContribution(moved) {
    moved = moved || []; var up = null, down = null;
    for (var i = 0; i < moved.length; i++) {
      var m = moved[i];
      if (m.dir === "up") { if (!up || m.mag > up.mag) up = m; }
      else { if (!down || m.mag > down.mag) down = m; }
    }
    // Lead with what the food ADDED (its biggest gain); fall back to the limit
    // it was high in only when it lifted nothing.
    if (up && up.label) return "added " + up.label.toLowerCase();
    if (down && down.label) return "high in " + down.label.toLowerCase();
    return "building your day";
  }
  function setPayoff() {
    els.eyebrow.textContent = "Your best day";
    els.food.innerHTML = 'Same calories &mdash; <span class="sb-to">smarter picks</span>';
    els.score.textContent = SCORES[NSTEP];
    els.delta.textContent = "+" + (SCORES[NSTEP] - SCORES[0]) + " from as-eaten"; els.delta.classList.add("up");
    announce("Your best day: " + SCORES[NSTEP] + " out of 100, up " + (SCORES[NSTEP] - SCORES[0]) + " from as eaten.");
  }
  function revealControls() {
    els.controls.classList.remove("pre"); introDone = true;
    EATEN.forEach(function (f) { if (f.swap != null && f.el) f.el.classList.add("ready"); });
    var firstSwap = null; EATEN.forEach(function (f) { if (firstSwap == null && f.swap != null) firstSwap = f; });
    if (firstSwap && firstSwap.el) { firstSwap.el.classList.add("demo"); T(function () { firstSwap.el.classList.remove("demo"); }, 2800); }
    if (els.skip) els.skip.innerHTML = "&#8635; Replay";
  }
  function resolveIntro() { setPayoff(); revealControls(); }
  function jumpIntroEnd() { clearTimers(); runId++; playing = false; introClearHL(); EATEN.forEach(function (f) { if (f.el) f.el.classList.add("in"); }); cursor = NSTEP; drawSnap(NSTEP); setPayoff(); revealControls(); }

  function introRun() {
    introDone = false; clearTimers(); var myRun = ++runId; playing = false; setPlayGlyph();
    els.controls.classList.add("pre"); if (els.skip) els.skip.textContent = "Skip";
    resetFoodList(); introClearHL();
    setPoly(BUILD[0]); ghost.style.display = "none"; clearHalos();
    els.score.textContent = "—";
    if (NSTEP < 1) { jumpIntroEnd(); return; }
    if (reduced()) { jumpIntroEnd(); return; }
    introOverview(myRun, function () {
      if (myRun !== runId) return;
      relivePhase(myRun, function () { if (myRun !== runId) return; playFrom(0, resolveIntro); });
    });
  }

  function bindControls() {
    var q = function (sel) { return els.root.querySelector(sel); };
    var on = function (sel, fn) { var b = q(sel); if (b) b.addEventListener("click", fn); };
    on(".pt-prev", function () { if (introDone) setCursor(cursor - 1); });
    on(".pt-next", function () { if (introDone) setCursor(cursor + 1); });
    on(".pt-play", togglePlay);
    if (els.skip) els.skip.addEventListener("click", function () { if (introDone) introRun(); else jumpIntroEnd(); });
  }

  function init() {
    var root = document.querySelector(".fdz[data-fdz]"); if (!root) return;
    var data; try { data = JSON.parse(root.getAttribute("data-fdz")); } catch (e) { return; }
    if (!data || !data.buildDs || !data.framesDs) return;
    BUILD = data.buildDs; FRAMES = data.framesDs; SCORES = data.scores;
    STEPS = data.steps || []; EATEN = data.eaten || []; BUILD_MOVED = data.buildMoved || [];
    LIMIT_VERTS = data.limitVerts || []; FULL_D = data.fullD || "";
    NSTEP = FRAMES.length - 1;
    clearTimers(); runId++; cursor = 0; playing = false; introDone = false;
    els = { root: root, eyebrow: byId("fdzEyebrow"), food: byId("fdzFood"),
            score: byId("fdzScore"), delta: byId("fdzDelta"), announce: byId("fdzAnnounce"),
            kept: byId("fdzKept"), controls: byId("fdzControls"),
            skip: byId("fdzSkip"), steps: byId("fdzSteps") };
    if (!els.score || !bindRadar()) return;
    buildChips(); buildSteps(); bindControls(); introRun();
  }

  if (window.jQuery) {
    var $ = window.jQuery;
    $(document).on("shiny:value", function (e) { if (e.name === "freshday_dayzoom") setTimeout(init, 40); });
  }
  if (document.readyState !== "loading") setTimeout(init, 60); else document.addEventListener("DOMContentLoaded", function () { setTimeout(init, 60); });
})();

</script>
