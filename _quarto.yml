project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - CNAME
    # Public tool surfaces linked from essays; kept at /artifacts/ so circulating
    # links survive, but with no index page there the directory itself 404s.
    - "artifacts/*.html"
    - favicon.png
    - favicon-mark.ico
    - fresh-mark.png
    - fresh-mark-cream.png

website:
  title: "FRESH Insights"
  description: "What to do when credible sources disagree: notes on evidence quality, uncertainty, and the gaps between what experts conclude and what the public believes, from the FRESH platform. Better information is the health lever almost nobody is pulling."
  site-url: "https://insights.freshfoodrecs.com"
  favicon: favicon-mark.ico
  google-analytics: "G-KR59MZC5RR"
  cookie-consent:
    type: implied
    style: simple
    palette: dark
  navbar:
    background: "#1a3a2a"
    foreground: "#fffdf8"
    logo: fresh-mark-cream.png
    logo-alt: "FRESH"
    title: false   # logo is the brand mark; no wordmark in the bar (keeps nav close to the logo)
    left:
      - text: "Insights"
        href: index.qmd
      - text: "Resources"
        href: resources/index.qmd
      - text: "Archive"
        href: archive.qmd
    right:
      - text: "Subscribe"
        href: "https://freshfoodrecs.com/#block-07484c6c6ed59fbe2c92"
      - icon: rss
        href: index.xml
  # On-page comments: native widget backed by our own Cloudflare Worker + D1
  # (worker/ — fresh-insights-engage). Injected via _comments-native.html in
  # include-after-body; listing pages / hub / embeds are skipped in its JS.
  # (giscus was the interim system; config removed when this went live.)
  page-footer:
    background: "#1a3a2a"
    foreground: "#fffdf8"
    center: >-
      **FRESH** — Food Recommendations for Equitable, Sustainable Health<br>
      Claims carried end to end, with the uncertainty kept intact<br>
      **Measurement Engine** · **Evidence Engine** · **Consumption & Equity Engine** ·
      **Decision Engine** · **Policy & Distribution Layer**

format:
  html:
    theme: cosmo
    css: styles.css
    include-after-body:
      - _comments-native.html
      - _subscribe-band.html
    toc: true
    toc-depth: 2
    fig-cap-location: bottom
    grid:
      sidebar-width: 0px
      body-width: 980px
      margin-width: 250px
      gutter-width: 1.5rem
    mainfont: "Source Sans 3, Segoe UI, sans-serif"
    fontcolor: "#1a2a22"
    linkcolor: "#2a5a3a"
    code-tools: false
